// ===== Super Tock: online play =====
// The host's phone runs the real game (engine + computer players). Everyone else sends "intents"
// (play this card / burn / pass) and receives the host's game state. Everything goes through NET,
// a tiny wrapper over Firebase Realtime Database (or a local test double).
const FIREBASE_CONFIG = (typeof window !== 'undefined' && window.SUPER_TOCK_FIREBASE) || null;
let NET = null;
function makeFirebaseNet(cfg){
  try {
    if (typeof firebase === 'undefined') return null;
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    const db = firebase.database();
    return {
      write: (p, v) => db.ref(p).set(v),
      patch: (p, v) => db.ref(p).update(v),
      read: p => db.ref(p).once('value').then(s => s.val()),
      add: (p, v) => db.ref(p).push(v),
      del: p => db.ref(p).remove(),
      watch: (p, cb) => { const r = db.ref(p), h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); }
    };
  } catch (e) { return null; }
}
// Test double: same API, stored in localStorage and shared between tabs of one browser.
function makeMockNet(){
  const KEY = 'st.mocknet', listeners = [];
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
  const get = (t, p) => p.split('/').filter(Boolean).reduce((o, k) => (o && typeof o === 'object') ? o[k] : undefined, t);
  const setp = (t, p, v) => { const ks = p.split('/').filter(Boolean); let o = t; for (let i = 0; i < ks.length - 1; i++) { if (!o[ks[i]] || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; } if (v === null || v === undefined) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = v; };
  const fire = () => { const t = load(); for (const l of listeners) { const v = get(t, l.p); const j = JSON.stringify(v === undefined ? null : v); if (j !== l.last) { l.last = j; l.cb(v === undefined ? null : JSON.parse(j)); } } };
  const save = t => { localStorage.setItem(KEY, JSON.stringify(t)); setTimeout(fire, 0); };
  window.addEventListener('storage', e => { if (e.key === KEY) fire(); });
  let n = 0;
  return {
    write: async (p, v) => { const t = load(); setp(t, p, v); save(t); },
    patch: async (p, v) => { const t = load(); for (const k in v) setp(t, p + '/' + k, v[k]); save(t); },
    read: async p => { const v = get(load(), p); return v === undefined ? null : v; },
    add: async (p, v) => { const t = load(); setp(t, p + '/k' + Date.now().toString(36) + (n++) + Math.random().toString(36).slice(2, 6), v); save(t); },
    del: async p => { const t = load(); setp(t, p, null); save(t); },
    watch: (p, cb) => { const l = {p, cb, last: undefined}; listeners.push(l); setTimeout(fire, 0); return () => { const i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); }; }
  };
}
try {
  if (/[?&]mock\b/.test(location.search)) NET = makeMockNet();
  else if (FIREBASE_CONFIG) NET = makeFirebaseNet(FIREBASE_CONFIG);
} catch (e) { NET = null; }

// ---------- online session ----------
const ON = {active:false, host:false, code:null, pid:null, seat:-1, L:null, seq:0, unsub:[], queue:[], busyRemote:false, stateWatched:false, chain:Promise.resolve()};
function myPid(){ let id = LS.get('st.pid', null); if (!id) { id = 'p' + Math.random().toString(36).slice(2, 10); LS.set('st.pid', id); } return id; }
ON.pid = myPid();
function gpath(x){ return `games/${ON.code}/${x}`; }
function newCode(){ const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
function onlineReset(){ for (const u of ON.unsub) try { u(); } catch (e) {} ON.unsub = []; Object.assign(ON, {active:false, host:false, code:null, seat:-1, L:null, seq:0, queue:[], busyRemote:false, stateWatched:false, chain:Promise.resolve()}); }
const isClient = () => ON.active && !ON.host && screen === 'game';
const isHostOnline = () => ON.active && ON.host;

// ---------- lobby ----------
function defaultLobby(code){
  const s = defaultSetup('solo');
  return {code, host:ON.pid, started:false, n:4, level:'medium', speed:'normal', partners:false, center:'off', jokers:true,
    seats:[0,1,2,3].map(i => i === 0 ? {kind:'human', pid:ON.pid, name:(profile.name || 'Host').trim(), team:0} : {kind:'open', pid:null, name:'', team:i % 2})};
}
function fitLobby(L){
  for (let i = 0; i < L.n; i++) if (!L.seats[i]) L.seats[i] = {kind:'open', pid:null, name:'', team:0};
  L.seats.length = L.n;
  if (L.n % 2) L.partners = false;
  const ok = () => { const c = {}; for (const x of L.seats) c[x.team] = (c[x.team] || 0) + 1; return Object.values(c).length === L.n / 2 && Object.values(c).every(v => v === 2); };
  if (L.n % 2 === 0 && (L.seats.some(x => x.team === undefined || x.team >= L.n / 2) || !ok())) L.seats.forEach((x, i) => x.team = i % (L.n / 2));
}
function lobbyTeamsOk(L){ const c = {}; for (const x of L.seats) c[x.team] = (c[x.team] || 0) + 1; return Object.values(c).length === L.n / 2 && Object.values(c).every(v => v === 2); }
async function pushLobby(){ if (ON.host && ON.L) await NET.write(gpath('lobby'), JSON.stringify(ON.L)); }
function watchLobby(){
  ON.unsub.push(NET.watch(gpath('lobby'), v => {
    if (!v) { if (!ON.host && ON.active) { flash('That game was closed'); onlineReset(); screen = 'online'; render(); } return; }
    ON.L = JSON.parse(v);
    if (ON.L.started && screen !== 'game') { watchState(); return; }
    if (screen === 'lobby') render();
  }));
}
async function hostGame(){
  if (!NET) return;
  onlineReset(); ON.active = true; ON.host = true;
  for (let t = 0; t < 5; t++) { ON.code = newCode(); if (!(await NET.read(gpath('lobby')))) break; }
  ON.L = defaultLobby(ON.code);
  await NET.write(`games/${ON.code}/created`, Date.now());
  await pushLobby();
  watchLobby(); watchIntents();
  screen = 'lobby'; render();
}
async function joinGame(code){
  if (!NET) return;
  code = (code || '').trim().toUpperCase();
  if (code.length < 4) { flash('Enter the 4-letter game code'); return; }
  onlineReset(); ON.active = true; ON.host = false; ON.code = code;
  const v = await NET.read(gpath('lobby'));
  if (!v) { flash('No game with that code'); onlineReset(); return; }
  ON.L = JSON.parse(v);
  if (ON.L.host === ON.pid) { ON.host = true; watchIntents(); }          // you started this one: you're the host again
  watchLobby();
  if (ON.L.started) { watchState(); return; }
  screen = 'lobby'; render();
}
function sendLobbyIntent(kind, data){ return NET.add(gpath('intents'), JSON.stringify({pid:ON.pid, kind, data, name:(profile.name || '').trim()})); }

// ---------- host: apply what the other phones ask for ----------
function watchIntents(){
  ON.unsub.push(NET.watch(gpath('intents'), v => {
    if (!v) return;
    for (const k of Object.keys(v)) { if (!ON.queue.some(q => q.k === k)) ON.queue.push({k, it:JSON.parse(v[k])}); }
    processQueue();
  }));
}
async function processQueue(){
  if (!ON.host || ON.busyRemote) return;
  while (ON.queue.length) {
    if (busy) { setTimeout(processQueue, 250); return; }
    const {k, it} = ON.queue.shift();
    ON.busyRemote = true;
    try { await applyIntent(it); } catch (e) { console.warn('intent failed', e); }
    ON.busyRemote = false;
    NET.del(gpath('intents/' + k));
  }
}
async function applyIntent(it){
  const L = ON.L;
  // ---- lobby requests ----
  if (it.kind === 'sit' && L && !L.started) {
    const i = it.data.seat, cur = L.seats.findIndex(x => x.pid === it.pid);
    if (L.seats[i] && L.seats[i].kind === 'open') { if (cur >= 0) L.seats[cur] = {kind:'open', pid:null, name:'', team:L.seats[cur].team}; L.seats[i] = {kind:'human', pid:it.pid, name:(it.name || 'Player').slice(0, 12), team:L.seats[i].team}; await pushLobby(); }
    return;
  }
  if (it.kind === 'leave' && L && !L.started) { const cur = L.seats.findIndex(x => x.pid === it.pid); if (cur > 0) { L.seats[cur] = {kind:'open', pid:null, name:'', team:L.seats[cur].team}; await pushLobby(); } return; }
  if (it.kind === 'rename' && L && !L.started) { const cur = L.seats.findIndex(x => x.pid === it.pid); if (cur >= 0) { L.seats[cur].name = (it.name || 'Player').slice(0, 12); await pushLobby(); } return; }
  // ---- game requests ----
  if (!G || G.phase === 'over') return;
  const seat = G.players.findIndex(pl => pl.pid === it.pid);
  if (seat < 0) return;
  if (it.kind === 'pass' && G.phase === 'pass' && G.passSel && G.passSel[seat] === null && G.hands[seat][it.data.h]) {
    choosePass(G, seat, it.data.h); lastEv = []; save(); loop(); return;
  }
  if (G.phase !== 'play' || G.turn !== seat) return;
  if (it.kind === 'burn') {
    if (!canBurn(G, seat) || !G.hands[seat][it.data.h]) return;
    burnCard(G, seat, it.data.h); lastEv = []; save(); loop(); return;
  }
  if (it.kind === 'move') {
    const ms = genMoves(G, seat, it.data.h);
    const mv = ms.find(m => it.data.action ? m.action === it.data.action :
      m.picks.length === it.data.picks.length && m.picks.every((pk, i) => pk.key === it.data.picks[i][0] && pk.label === it.data.picks[i][1]));
    if (!mv) return;
    busy = true; drawGame();
    const ev = playMove(G, mv); lastEv = ev;
    save();                                  // everyone starts animating at the same time
    await animate(ev); dingFx(ev, seat);
    busy = false; drawGame(); loop();
  }
}

// ---------- everyone: follow the host's game ----------
let lastEv = [];
function publishState(){
  if (!isHostOnline() || !G) return;
  ON.seq++;
  NET.write(gpath('state'), {seq:ON.seq, g:JSON.stringify(G), ev:JSON.stringify(lastEv || [])});
  lastEv = [];
}
function watchState(){
  if (ON.stateWatched) return; ON.stateWatched = true;
  ON.unsub.push(NET.watch(gpath('state'), v => { ON.chain = ON.chain.then(() => followState(v)).catch(() => {}); }));
}
async function followState(v){
  {
    if (!v) return;
    const g = JSON.parse(v.g);
    if (ON.host) {                                   // host reopening its own game: pick up where it left off
      if (screen !== 'game') { G = g; ON.seq = v.seq; enterOnlineGame(); }
      return;
    }
    if (v.seq <= ON.seq) return;
    const first = screen !== 'game', step = v.seq === ON.seq + 1;
    ON.seq = v.seq; G = g;
    if (first) { enterOnlineGame(); return; }
    const ev = JSON.parse(v.ev || '[]');
    if (step && ev.length && !document.hidden) { busy = true; sel = null; drawGame(); await animate(ev); busy = false; dingFx(ev, G.last ? G.last.p : -1); }
    else placeMarbles();
    sel = null; burnPick = false; drawGame();
  }
}
function enterOnlineGame(){
  ON.seat = G.players.findIndex(pl => pl.pid === ON.pid);
  viewer = ON.seat >= 0 ? ON.seat : 0;
  sel = null; curtain = null; busy = false; burnPick = false; menuOpen = false; trade = null;
  screen = 'game'; render();
}
async function hostStart(){
  const L = ON.L;
  if (L.partners && !lobbyTeamsOk(L)) { flash('Each team needs exactly 2 players'); return; }
  let order = L.seats.map((x, i) => i);
  if (L.partners && L.n % 2 === 0) {
    const half = L.n / 2, teams = [];
    L.seats.forEach((x, i) => { (teams[x.team] = teams[x.team] || []).push(i); });
    teams.sort((A, B) => Math.min(...A) - Math.min(...B));
    order = new Array(L.n); teams.forEach((t, k) => { order[k] = t[0]; order[k + half] = t[1]; });
  }
  const players = order.map(i => { const x = L.seats[i]; const human = x.kind === 'human';
    return {name: human ? (x.name || 'Player') : CNAMES[i], human, pid: human ? x.pid : null, color:i}; });
  const set = {partners:L.partners && L.n % 2 === 0, hop:false, around:false, center:L.center, openHands:false, level:L.level, speed:L.speed, decks:'auto', jokers:L.jokers};
  G = newGame({players, set, cfg:rules}); G.online = L.code;
  L.started = true; await pushLobby();
  lastEv = []; ON.seq = 0; publishState();
  ON.stateWatched = true;                             // host doesn't need to follow itself
  enterOnlineGame();
}

// ---------- screens ----------
function onlineHTML(){
  if (!NET) return `<div class="scr lux">${lhdr('PLAY ONLINE', 'home')}
    <div class="sgroup" style="padding:16px"><p class="hint" style="margin:0">Online play runs on the Super Tock website, where friends just open a link, no sign-in needed. This copy is the test version.</p></div></div>`;
  const pre = (new URLSearchParams(location.search).get('join') || '').toUpperCase();
  return `<div class="scr lux online">${lhdr('PLAY ONLINE', 'home')}
    <div class="namebox"><label class="lbl">YOUR NAME</label><input class="txt" data-in="pname" maxlength="14" placeholder="Enter your name" value="${esc(profile.name)}"></div>
    <button class="lux-cta" data-a="ohost">${ICON.crown}<span>HOST A GAME</span></button>
    <h3 class="lh3">JOIN A GAME</h3>
    <div class="joinrow"><input class="txt code" id="joincode" maxlength="4" placeholder="CODE" value="${esc(pre)}" autocapitalize="characters" autocomplete="off"><button class="lux-btn" data-a="ojoin">${ICON.people}<span>JOIN</span></button></div>
    <p class="hint center">The host gets a 4-letter code. Everyone else enters it here, or opens the invite link.</p>
  </div>`;
}
function lobbyHTML(){
  const L = ON.L; if (!L) return '';
  const me = L.seats.findIndex(x => x.pid === ON.pid), host = ON.host;
  const lseg = (key, vals, names) => `<div class="lseg">${vals.map((v, i) => `<button data-a="${host ? 'lset' : 'locked'}" data-k="${key}" data-v="${v}" class="${String(L[key]) === String(v) ? 'on' : ''}">${names[i]}</button>`).join('')}</div>`;
  const opt = (a, k, on, icon, title, sub, dis) => `<button class="otile ${on ? 'on' : ''} ${dis ? 'dis' : ''}" data-a="${host && !dis ? a : 'locked'}" data-k="${k}"><i class="tick">${on ? ICON.check : ''}</i>${icon}<b>${title}</b><span>${sub}</span></button>`;
  const link = `${location.origin}${location.pathname}?join=${L.code}`;
  const seatRow = (x, i) => {
    let right;
    if (x.kind === 'open') right = host ? `<button class="who" data-a="lcpu" data-i="${i}">Make computer</button>` : `<button class="who h" data-a="lsit" data-i="${i}">Sit here</button>`;
    else if (x.kind === 'cpu') right = host ? `<button class="who" data-a="lopen" data-i="${i}">Computer ✕</button>` : `<span class="who">Computer</span>`;
    else right = `<span class="who h">${x.pid === ON.pid ? 'You' : i === 0 ? 'Host' : 'Joined'}</span>`;
    const team = L.partners ? `<button class="team t${x.team}" data-a="${host ? 'lteam' : 'locked'}" data-i="${i}">Team ${String.fromCharCode(65 + x.team)}</button>` : '';
    const nm = x.kind === 'open' ? '<span class="open">Open seat</span>' : esc(x.kind === 'cpu' ? CNAMES[i] : x.name);
    return `<div class="seat">${orb(COLORS[i], 26)}<div class="namefield">${x.kind === 'cpu' ? ICON.monitor : ICON.user}<span class="nm">${nm}</span></div>${team}${right}</div>`;
  };
  const centerSub = L.center === 'off' ? 'Disabled' : L.center === 'count' ? 'Exact count' : 'Special card';
  return `<div class="scr setup lux lobby">
    ${lhdr('GAME LOBBY', 'oleave')}
    <div class="codebox"><span>GAME CODE</span><b>${L.code}</b><button class="lux-btn" data-a="oshare" data-link="${esc(link)}">${ICON.people}<span>INVITE FRIENDS</span></button><small>${esc(link)}</small></div>
    ${host ? `<h3 class="lh3">PLAYERS</h3><div class="nums">${[4,5,6].map(n => `<button data-a="ln" data-v="${n}" class="${L.n === n ? 'on' : ''}">${n}</button>`).join('')}</div>` : ''}
    <h3 class="lh3">PLAYERS AT THE TABLE</h3>
    <div class="seats">${L.seats.map(seatRow).join('')}</div>
    ${me < 0 && !host ? '<p class="hint center"><b>Tap “Sit here” to take a seat.</b></p>' : ''}
    ${L.partners ? `<p class="hint">${lobbyTeamsOk(L) ? 'Partners sit across from each other.' : '<b class="warn">Each team needs exactly 2 players.</b>'}</p>` : ''}
    ${L.seats.some(x => x.kind === 'cpu' || x.kind === 'open') ? `<h3 class="lh3">COMPUTER STRENGTH</h3>${lseg('level', ['easy','medium','hard'], ['Relaxed','Medium','Hard'])}` : ''}
    <h3 class="lh3">GAME SPEED</h3>${lseg('speed', ['slow','normal','fast'], ['Relaxed','Normal','Fast'])}
    <h3 class="lh3">GAME OPTIONS</h3>
    <div class="otiles">
      ${opt('ltog', 'jokers', L.jokers, ICON.joker, 'Jokers', '(2 per deck)')}
      ${opt('ltog', 'partners', L.partners, ICON.people, 'Partners', L.n % 2 ? 'not with 5' : '(teams of 2)', L.n % 2)}
      ${opt('lcyc', 'center', L.center !== 'off', ICON.ring, 'Center Hole', centerSub)}
    </div>
    <p class="hint center">${host ? 'Open seats left empty become computer players when you start. Tap Card Rules below to change any card before you start.' : 'Waiting for the host to start the game…'}</p>
    ${host ? `<div class="sticky"><button class="lux-cta" data-a="ostart">START GAME <span>▶</span></button></div>
    <button class="lux-btn rulesbtn2" data-a="rules" data-from="lobby">${ICON.cards}<span>CARD RULES: ${(sameCfg(rules, CLASSIC) ? 'Ron’s Rules' : 'Custom').toUpperCase()}</span></button>` : '<div style="height:40px"></div>'}
  </div>`;
}

// ---------- hooks into the existing game code ----------
const _render0 = render;
render = function(){
  if (screen === 'online') { clearTimeout(aiTimer); app.innerHTML = onlineHTML(); window.scrollTo(0, 0); return; }
  if (screen === 'lobby') { const y = window.scrollY; app.innerHTML = lobbyHTML(); window.scrollTo(0, y); return; }
  _render0();
};
const _save0 = save;
save = function(){ if (ON.active && !ON.host) return; _save0(); publishState(); };
const _loop0 = loop;
loop = function(){ if (isClient()) { clearTimeout(aiTimer); drawGame(); return; } _loop0(); };
const _setViewer0 = setViewer;
setViewer = function(p){ if (ON.active) { curtain = null; return; } _setViewer0(p); };
const _doMove0 = doMove;
doMove = async function(mv){
  if (isClient()) { busy = true; sel = null; drawGame(); await sendLobbyIntent('move', {h:mv.h, action:mv.action || null, picks:mv.picks.map(p => [p.key, p.label])}); clientWait(); return; }
  if (isHostOnline()) { busy = true; drawGame(); const ev = playMove(G, mv); lastEv = ev; save(); await animate(ev); dingFx(ev, mv.p); busy = false; loop(); return; }
  return _doMove0(mv);
};
const _doBurn0 = doBurn;
doBurn = async function(p, h){
  if (isClient()) { busy = true; sel = null; burnPick = false; drawGame(); await sendLobbyIntent('burn', {h}); clientWait(); return; }
  if (isHostOnline()) lastEv = [];
  return _doBurn0(p, h);
};
const _choosePass0 = choosePass;
choosePass = function(st, p, h){
  if (isClient() && st === G && p === ON.seat) { G.passSel[p] = G.hands[p][h].id; sendLobbyIntent('pass', {h}); drawGame(); return; }
  return _choosePass0(st, p, h);
};
// clients: if the host never answers (dropped connection), unlock after a few seconds
let _cw = null;
function clientWait(){ clearTimeout(_cw); _cw = setTimeout(() => { if (busy) { busy = false; drawGame(); flash('Waiting on the host…'); } }, 6000); }
// AI turns on the host also publish their moves
const _animate0 = animate;
animate = async function(ev){ return _animate0(ev); };

// ---------- clicks for the new screens ----------
app.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, d = t.dataset, L = ON.L;
  if (a === 'online') { e.stopImmediatePropagation(); screen = 'online'; render(); return; }
  if (a === 'again' && ON.active && !ON.host) { e.stopImmediatePropagation(); flash('The host starts the next game'); return; }
  if (a === 'ohost') { if (!(profile.name || '').trim()) { flash('Enter your name first'); return; } await hostGame(); }
  else if (a === 'ojoin') { if (!(profile.name || '').trim()) { flash('Enter your name first'); return; } await joinGame(document.getElementById('joincode').value); }
  else if (a === 'oleave') { if (!ON.host && L) sendLobbyIntent('leave', {}); else if (ON.host && L && !L.started) NET.del(`games/${L.code}`); onlineReset(); screen = 'home'; render(); }
  else if (a === 'oshare') { const link = d.link; try { if (navigator.share) { await navigator.share({title:'Super Tock', text:`Join my Super Tock game! Code ${L.code}`, url:link}); return; } } catch (err) {} try { await navigator.clipboard.writeText(link); flash('Invite link copied'); } catch (err) { flash('Code: ' + L.code); } }
  else if (a === 'lsit') sendLobbyIntent('sit', {seat:+d.i});
  else if (!ON.host) return;
  else if (a === 'ln') { L.n = +d.v; fitLobby(L); await pushLobby(); render(); }
  else if (a === 'lcpu') { L.seats[+d.i] = {kind:'cpu', pid:null, name:'', team:L.seats[+d.i].team}; await pushLobby(); render(); }
  else if (a === 'lopen') { L.seats[+d.i] = {kind:'open', pid:null, name:'', team:L.seats[+d.i].team}; await pushLobby(); render(); }
  else if (a === 'lteam') { const x = L.seats[+d.i]; x.team = (x.team + 1) % (L.n / 2); await pushLobby(); render(); }
  else if (a === 'lset') { L[d.k] = d.v; await pushLobby(); render(); }
  else if (a === 'ltog') { L[d.k] = !L[d.k]; fitLobby(L); await pushLobby(); render(); }
  else if (a === 'lcyc') { const o = ['off', 'count', 'card']; L.center = o[(o.indexOf(L.center) + 1) % 3]; await pushLobby(); render(); }
  else if (a === 'ostart') { L.seats.forEach(x => { if (x.kind === 'open') x.kind = 'cpu'; }); await hostStart(); }
}, true);
// quitting an online game from the pause menu leaves the session
app.addEventListener('click', e => { const t = e.target.closest('[data-a]'); if (t && t.dataset.a === 'mquit' && ON.active) { onlineReset(); } }, true);
// open straight to the join screen from an invite link
if (/[?&]join=/.test(location.search) && NET) screen = 'online';
render();

</script>
