<style>
:root{--bg:#17121f;--bg2:#221a2e;--card:#2a2138;--line:#3a2f4c;--txt:#f4eefc;--mut:#a99bbd;--acc:#ff7a45;--acc2:#ffb347;--ok:#35d07f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#3a2350 0%,transparent 60%),radial-gradient(900px 600px at 100% 110%,#3b1f18 0%,transparent 55%),var(--bg);background-attachment:fixed;min-height:100%;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3,.tile b,.cta,.btitle{font-family:"Fredoka","Baloo 2",system-ui,sans-serif}
.scr{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 28px)}
.hero{text-align:center;padding:0 0 8px;position:relative}
.tilt{width:118%;margin:-8% -9% -46%;transform:perspective(900px) rotateX(52deg) rotateZ(-8deg);transform-origin:50% 50%;filter:drop-shadow(0 30px 30px rgba(0,0,0,.55));-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent 98%);mask-image:linear-gradient(to bottom,#000 55%,transparent 98%);animation:spin 60s linear infinite;pointer-events:none}
.tilt svg{display:block;width:100%;height:auto}
@keyframes spin{from{transform:perspective(900px) rotateX(52deg) rotateZ(0deg)}to{transform:perspective(900px) rotateX(52deg) rotateZ(360deg)}}
@media (prefers-reduced-motion:reduce){.tilt{animation:none}}
.mrow{height:44px}
h1{position:relative;font-size:62px;line-height:.88;margin:0 0 6px;letter-spacing:3px;font-weight:700;color:#fff6e8;text-shadow:0 4px 0 #6e4120,0 10px 24px rgba(0,0,0,.6)}
h1 span{display:block;font-size:82px;background:linear-gradient(180deg,#ffd27a 10%,#ff8a45 60%,#e2572b);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 #6e2a10) drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.tag{position:relative;color:#e7d6c2;margin:8px 0 18px;letter-spacing:.5px}
.lbl{display:block;color:var(--mut);font-weight:600;font-size:14px;margin:6px 4px}
.txt{width:100%;background:var(--bg2);border:1.5px solid var(--line);color:var(--txt);border-radius:14px;padding:14px 16px;font-size:17px;outline:none}
.txt:focus{border-color:var(--acc)}
.txt.sm{padding:9px 12px;font-size:15px;border-radius:10px}
.resume{width:100%;margin:16px 0 0;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#2a1405;font-weight:800;font-size:18px;border-radius:16px;padding:16px 18px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.resume small{opacity:.7;font-weight:700}
.tile{width:100%;display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile i{grid-row:span 2;width:40px;height:40px;border-radius:50%;box-shadow:inset -6px -8px 12px rgba(0,0,0,.35),inset 5px 5px 10px rgba(255,255,255,.35)}
.tile b{font-size:21px;font-weight:600}.tile span{color:var(--mut);font-size:14px}
.tile.off{opacity:.55}
.row2{display:flex;gap:10px;margin-top:16px}
.ghost{flex:1;background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:12px;font-weight:700;color:var(--txt)}
.ghost.wide{width:100%;margin-top:10px}
.foot{color:var(--mut);text-align:center;font-size:14px;margin-top:22px}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px;position:relative}
.hdr h2{flex:1;text-align:center;margin:0;font-size:22px;padding-right:54px}
.back{color:var(--mut);font-weight:700;font-size:16px;padding:8px 4px;white-space:nowrap}
h3{margin:22px 2px 10px;font-size:18px}h3 small{font-family:system-ui;font-weight:500;color:var(--mut);font-size:13px;margin-left:6px}
.nums{display:flex;flex-wrap:wrap;gap:8px}
.nums button{width:52px;height:46px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);font-weight:800;font-size:17px}
.nums button.on,.seg button.on{background:var(--acc);border-color:var(--acc);color:#2a1405}
.seg{display:flex;gap:6px;background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;padding:11px 6px;border-radius:10px;font-weight:700;font-size:15px;border:1.5px solid transparent}
.hint{color:var(--mut);font-size:14px;line-height:1.4;margin:10px 2px}
.seats{display:flex;flex-direction:column;gap:8px}
.seat{display:flex;align-items:center;gap:10px}
.seat>i{flex:none;width:22px;height:22px;border-radius:50%}
.who{flex:none;width:86px;padding:9px 0;text-align:center;font-size:14px;border-radius:10px;background:var(--bg2);border:1.5px solid var(--line);font-weight:700;color:var(--mut)}
.who.h{color:var(--txt);border-color:var(--ok)}
.team{flex:none;width:72px;padding:9px 0;border-radius:10px;font-weight:800;font-size:13px;border:1.5px solid var(--line);background:var(--bg2)}
.team.t0{color:#ffb347;border-color:#ffb34777}.team.t1{color:#6ec6ff;border-color:#6ec6ff77}.team.t2{color:#7be495;border-color:#7be49577}
.team.t3{color:#f78fb3;border-color:#f78fb377}.team.t4{color:#c9a7ff;border-color:#c9a7ff77}.team.t5{color:#ffe066;border-color:#ffe06677}
.warn{color:#ff8a6b}
.tog{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.tog>div{flex:1}.tog b{display:block;font-size:16px}.tog span{color:var(--mut);font-size:13px;line-height:1.35;display:block;margin-top:3px}
.tog>i{display:block;flex:none;width:52px;height:31px;border-radius:20px;background:#4a4058;position:relative;transition:.2s}
.tog>i:after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:.2s}
.tog>i.on{background:var(--ok)}.tog>i.on:after{left:24px}
.tog.dis{opacity:.45;cursor:default}
.rulesbtn{width:100%;text-align:left;background:var(--bg2);border:1.5px dashed var(--acc);border-radius:16px;padding:14px 16px;margin:6px 0 90px}
.rulesbtn b{display:block}.rulesbtn span{color:var(--mut);font-size:13px}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 35%)}
.cta{display:block;width:100%;max-width:524px;margin:0 auto;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#2a1405;font-size:22px;font-weight:700;border-radius:18px;padding:16px}
/* cards */
.card{width:62px;height:86px;border-radius:10px;background:linear-gradient(160deg,#fffefa,#f3ece0);color:#1d1a24;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.06);position:relative}
.card:before{content:"";position:absolute;inset:4px;border-radius:7px;border:1px solid rgba(160,110,40,.25);pointer-events:none}
.card b{font-size:28px;line-height:1;font-family:"Fredoka",system-ui}.card span{font-size:22px;line-height:1.1}
.card.red{color:#d7263d}
.card.joker{background:linear-gradient(160deg,#fff,#f1e8ff)}.card.joker .star{font-size:30px;color:#8b5cf6}.card.joker small{font-size:9px;font-weight:800;letter-spacing:2px;color:#8b5cf6}
.card.mini{width:40px;height:54px;border-radius:7px;flex:none}.card.mini b{font-size:18px}.card.mini span{font-size:14px}.card.mini.joker .star{font-size:20px}.card.mini.joker small{font-size:6px;letter-spacing:1px}
/* rules */
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{display:inline-flex;align-items:center;background:var(--bg2);border:1.5px solid var(--line);border-radius:20px;padding:7px 14px;font-weight:700;font-size:14px}
span.chip{padding:0}span.chip button{padding:7px 4px 7px 14px;font-weight:700}span.chip .x{padding:7px 12px 7px 8px;color:var(--mut)}
.saverow{display:flex;gap:8px;margin-bottom:14px}.saverow .ghost{flex:none;padding:0 18px}
.rrow{background:var(--card);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.rrow.open{border-color:var(--acc)}
.rhead{width:100%;display:flex;align-items:center;gap:14px;padding:10px 14px;text-align:left}
.rhead div{flex:1}.rhead b{display:block;font-size:17px}.rhead b em{font-style:normal;font-size:11px;background:var(--acc);color:#2a1405;padding:2px 7px;border-radius:8px;margin-left:6px;vertical-align:2px}
.rhead span{color:var(--mut);font-size:14px}.rhead>i{color:var(--mut);font-style:normal}
.ed{padding:4px 14px 14px;border-top:1px solid var(--line)}
.ed>.seg{margin:12px 0}
.erow{display:flex;align-items:center;justify-content:space-between;margin:12px 0;font-weight:600}
.erow.col{flex-direction:column;align-items:stretch;gap:8px}
.stp{display:flex;align-items:center;gap:4px;background:var(--bg2);border:1.5px solid var(--line);border-radius:12px}
.stp button{width:44px;height:40px;font-size:22px;font-weight:700}.stp button:disabled{opacity:.3}
.stp b{min-width:40px;text-align:center;font-size:18px}
.link{color:var(--acc);font-weight:700;padding:6px 0}
.prose{line-height:1.5;font-size:16px}.prose ul{padding-left:20px}.prose li{margin:6px 0}
/* game */
.game{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);max-width:640px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:6px;padding:6px 10px}
.chips{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.chips::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;align-items:center;gap:6px;background:var(--bg2);border:1.5px solid var(--line);border-radius:20px;padding:6px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.pchip i{width:12px;height:12px;border-radius:50%}.pchip b{color:var(--mut)}
.pchip em{font-style:normal;font-size:10px;background:var(--line);border-radius:6px;padding:1px 5px}
.pchip.turn{border-color:var(--acc);box-shadow:0 0 0 2px rgba(255,122,69,.25)}
.boardwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px 6px}
#board{width:100%;height:100%;max-width:100%;touch-action:manipulation}
.btitle{fill:#6e421d;fill-opacity:.45;font-weight:700;letter-spacing:4px}
.mb .ring{fill:none;stroke:#fff;stroke-width:0;opacity:0}
.mb.cand .ring{stroke:#fff;stroke-width:5;opacity:1;animation:pulse 1s ease-in-out infinite}
.mb.picked .ring{stroke:var(--acc);stroke-width:7;opacity:1;animation:none}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.panel{padding:4px 12px 8px}
.status{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;min-height:46px}
.last{grid-column:1/-1;color:var(--mut);font-size:13px;display:flex;align-items:center;gap:6px}
.last i{width:10px;height:10px;border-radius:50%}
.msg{font-weight:700;font-size:16px}
.deck{color:var(--mut);font-size:12px;text-align:right}
.dots:after{content:"…";animation:dots 1.2s steps(3) infinite}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;min-height:0}
.ob{background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px}
.ob.go{border-color:var(--acc);color:var(--acc)}
.hand{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:6px 0 4px;min-height:118px}
.hand .cwrap{flex:1 1 0;min-width:52px;max-width:74px}
.hand .cwrap .card{width:100%;height:auto;aspect-ratio:64/84}
.cwrap{display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .15s}
.cwrap small{font-size:10.5px;color:var(--mut);font-weight:700;max-width:72px;text-align:center;line-height:1.15}
.cwrap.sel{transform:translateY(-10px)}.cwrap.sel .card{box-shadow:0 0 0 3px var(--acc),0 8px 16px rgba(0,0,0,.4)}
.cwrap.dim .card{opacity:.4}.cwrap.wait .card{filter:saturate(.6) brightness(.85)}
.openh{width:100%;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut);justify-content:center}
.openh span{display:flex;align-items:center;gap:4px}.openh i{width:9px;height:9px;border-radius:50%}
.overlay{position:fixed;inset:0;background:rgba(10,6,16,.78);display:none;align-items:center;justify-content:center;padding:24px;z-index:5}
.overlay.show{display:flex}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:24px;width:100%;max-width:380px;text-align:center}
.box h2{margin:8px 0;font-size:26px}.box p{color:var(--mut)}
.box .big{display:block;width:56px;height:56px;border-radius:50%;margin:0 auto 6px;box-shadow:inset -8px -10px 14px rgba(0,0,0,.35),inset 6px 6px 12px rgba(255,255,255,.35)}
.box .cta{margin-top:14px;font-size:19px}
.box.tall{max-height:85vh;overflow:auto;text-align:left}.rl{padding-left:18px;font-size:14px;line-height:1.4}.rl li{margin:6px 0}.rl b{margin-right:4px}
#flash{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translate(-50%,20px);background:#fff;color:#1d1a24;font-weight:700;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#flash.show{opacity:1;transform:translate(-50%,0)}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"…"}}
@media (max-height:700px){.card{width:54px;height:76px}.card b{font-size:24px}.hand{min-height:104px}}

.ed h4{margin:16px 0 8px;font-size:15px;font-family:"Fredoka",system-ui}.ed h4 small{font-family:system-ui;color:var(--mut);font-weight:500;font-size:12px}
.ed .tog{background:var(--bg2);padding:11px 13px;margin-bottom:8px}

.trail{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.75;transition:opacity 1.2s}
.trail.fade{opacity:0}
.mb.moving circle:last-child{filter:url(#sh) brightness(1.15)}
.tog.nohov{cursor:default;margin-bottom:8px}

.sbox{opacity:0;transition:opacity .3s}
.sbox.on{opacity:1;animation:turnglow 1.4s ease-in-out infinite}
@keyframes turnglow{0%,100%{opacity:.35}50%{opacity:1}}
.game{background:radial-gradient(600px 420px at 50% 42%,rgba(255,180,110,.12),transparent 70%)}
.panel{background:linear-gradient(180deg,transparent,rgba(0,0,0,.25))}

.gpath{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.8;pointer-events:none}
.ghost{animation:gpulse 1.1s ease-in-out infinite}
@keyframes gpulse{0%,100%{opacity:.75}50%{opacity:1}}
.gbump{fill:none;stroke:#ff4d4d;stroke-width:4;stroke-dasharray:6 5}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border:1.5px solid var(--line);border-radius:20px;padding:8px 16px}
.pill i{width:14px;height:14px;border-radius:50%}
.waiting{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);font-weight:700;font-size:16px;min-height:110px}
.waiting small{font-weight:600;font-size:14px}
.toast{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700;font-size:14px}
.toast button{color:var(--mut);font-size:16px;padding:0 4px}
.deck{line-height:1.25}

.card.outc{background:linear-gradient(160deg,#fff6cf,#ffe08a);box-shadow:0 6px 14px rgba(0,0,0,.4),0 0 0 2px #f5b301}
.card.outc:before{border-color:rgba(190,130,0,.45)}
.first{grid-column:1/-1;display:flex;align-items:center;gap:7px;color:var(--mut);font-size:14px;font-weight:700;margin-top:6px}
.first i{width:11px;height:11px;border-radius:50%}
.lead{font-size:10px;font-weight:900;background:#f5b301;color:#2a1405;border-radius:6px;padding:1px 5px}

.card.flat{flex-direction:column;gap:4px}
.card .rs{display:flex;align-items:center;gap:2px}
.card.flat .rs b{font-size:26px}.card.flat .rs span{font-size:22px}
.card.mini .rs{flex-direction:column;gap:0}
.card em{font-style:normal;font-size:10.5px;font-weight:800;opacity:.6;letter-spacing:.2px;text-align:center;line-height:1.1;padding:0 3px}
.card.joker em{color:#8b5cf6;opacity:.8}

.hand .card.flat:before{display:none}
.hand .card.flat .rs b{font-size:23px}.hand .card.flat .rs span{font-size:19px}
.hand .card em{font-size:10px;opacity:.55;word-break:keep-all;overflow-wrap:normal}

button.deck{background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:6px 12px;color:var(--mut);font-size:12px;font-weight:700;line-height:1.3;text-align:center}
.logic{opacity:.7;margin-left:2px}
.box.log{text-align:left}.box.log h2{text-align:center}
.plays{list-style:none;padding:0;margin:8px 0 4px;max-height:58vh;overflow:auto}
.plays li{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.plays li i{width:11px;height:11px;border-radius:50%;flex:none}
.plays li span{color:var(--mut)}
.plays .lc{background:#fffdf8;color:#1d1a24 !important;border-radius:5px;padding:1px 6px;font-weight:800;font-size:13px}
.plays .lc.red{color:#d7263d !important}
.plays .hit{color:#ff8a6b !important;font-size:12px;font-weight:700}
.plays li.lh{color:var(--acc);font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;border:0;padding-top:12px}

.photorow{display:flex;align-items:center;gap:10px;margin:-2px 0 12px}
.photorow img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid #d4a548}
.photorow .ghost{flex:none;padding:10px 14px;cursor:pointer}
.hand .card.joker .star{font-size:20px;line-height:1}
.hand .card.joker small{font-size:7px;letter-spacing:1px}
.hand .card.joker em{font-size:9px}
.hand .card.flat.ten .rs b{font-size:19px;letter-spacing:-1px}.hand .card.flat.ten .rs span{font-size:16px}

/* ---- clean card faces (white, rounded, bold rounded type) ---- */
.hand .card{background:#fbfbfd;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.35);color:#1f2433;font-family:"Fredoka",ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
.hand .card:before{display:none}
.hand .card.red{color:#d11f3c}
.hand .card.flat .rs{gap:3px}
.hand .card.flat .rs b{font-size:24px;font-weight:700;letter-spacing:-.5px}
.hand .card.flat .rs span{font-size:20px}
.hand .card.flat.ten .rs b{font-size:20px;letter-spacing:-1.5px}.hand .card.flat.ten .rs span{font-size:16px}
.hand .card em{font-family:system-ui,-apple-system,sans-serif;font-size:10px;font-weight:700;opacity:1;color:#8a8f9c;line-height:1.2;margin-top:2px}
.hand .card.red em{color:#d9707f}
.hand .card.joker{background:#fbfbfd}
.hand .card.joker .star{font-size:22px;color:#8b5cf6;line-height:1}
.hand .card.joker small{font-family:system-ui,sans-serif;font-size:7px;font-weight:900;letter-spacing:1.5px;color:#8b5cf6}
.hand .card.joker em{color:#a78bfa;font-size:9px}
.cwrap.sel .card{box-shadow:0 0 0 3px #ffd36e,0 8px 16px rgba(0,0,0,.4)}
.cwrap.wait .card{filter:none;opacity:.55}
.hand .cwrap .card{aspect-ratio:60/88}
.hand .card.flat{justify-content:center;gap:3px;padding:4px 0}
.hand .cwrap .card{overflow:hidden}

.skipban{display:flex;flex-direction:column;gap:2px;background:linear-gradient(90deg,rgba(255,90,70,.22),rgba(255,90,70,.08));border:1.5px solid #ff6a55;border-radius:14px;padding:10px 14px;animation:skippop .35s ease-out}
.skipban b{color:#ff8a75;font-size:17px}.skipban span{color:#fff;font-size:15px;font-weight:700}
@keyframes skippop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.cwrap.discard .card{box-shadow:0 0 0 2.5px #ff6a55,0 6px 14px rgba(0,0,0,.4);animation:discardpulse 1.2s ease-in-out infinite}
@keyframes discardpulse{0%,100%{box-shadow:0 0 0 2px #ff6a5599,0 6px 14px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 3.5px #ff6a55,0 6px 14px rgba(0,0,0,.4)}}

/* =====================================================================
   SUPER TOCK — LUXURY SKIN (overrides everything above; visuals only)
   ===================================================================== */
:root{--gold1:#ffe9a8;--gold2:#e0b04f;--gold3:#a8741f;--gold4:#6e4a12;--ink:#0d0a1a;--navy:#141127;--navy2:#1c1834;--plum:#3b1758;--plum2:#24103a;--cream:#f8ecd2;--txt:#f5ecd8;--mut:#b9a98a}
html,body{background:radial-gradient(900px 600px at 50% -5%,#2a1b45 0%,transparent 60%),radial-gradient(700px 500px at 0% 100%,#2a1411 0%,transparent 60%),radial-gradient(700px 500px at 100% 100%,#1b1430 0%,transparent 60%),var(--ink)!important;color:var(--txt)}
.lux h1,.lux h2,.lux h3,.lux-cta,.lux-btn,.ltitle,.lh3,.ribbon span,.nums button,.lseg button,.otile b,.yt,.winribbon span,.rk{font-family:"Cinzel","Trajan Pro",Georgia,serif}
.goldtext,.lh3,.ltitle{background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}

/* round gold-rimmed icon buttons */
.cbtn{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:26px;line-height:1;color:var(--gold1);background:radial-gradient(circle at 50% 35%,#2a2346,#120f22);border:2px solid var(--gold2);box-shadow:0 0 0 2px #2b1b08,0 4px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.cbtn svg{width:22px;height:22px}.cbtn.blank{visibility:hidden}
.cbtn.gold{color:var(--gold1)}

/* ribbon banner */
.ribbon{position:relative;width:200px;height:46px;display:grid;place-items:center;flex:none}
.ribbon svg{position:absolute;inset:0;width:100%;height:100%}
.ribbon span{position:relative;font-weight:900;font-size:19px;letter-spacing:1px;background:linear-gradient(180deg,#fff1c4,#e8b551 60%,#b07a22);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #3a1f08)}
.ribbon.sm{width:170px;height:40px}.ribbon.sm span{font-size:16px}
.lhdr,.ghdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ltitle{text-align:center;font-size:22px!important;font-weight:700;letter-spacing:2px;margin:4px 0 10px!important;padding:0!important;display:flex;align-items:center;justify-content:center;gap:12px}
.ltitle i{flex:1;max-width:70px;height:2px;background:linear-gradient(90deg,transparent,var(--gold2));position:relative}
.ltitle i:last-child{background:linear-gradient(270deg,transparent,var(--gold2))}
.ltitle i:after{content:"";position:absolute;top:-3px;width:7px;height:7px;background:var(--gold2);transform:rotate(45deg)}
.ltitle i:first-child:after{right:-2px}.ltitle i:last-child:after{left:-2px}
.lh3{font-size:15px!important;font-weight:700;letter-spacing:1.5px;margin:20px 2px 10px!important}

/* framed panels / buttons */
.lux-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;padding:13px 16px;border-radius:30px;color:var(--gold1);font-weight:700;font-size:16px;letter-spacing:1px;background:linear-gradient(180deg,#221c3e,#141028);border:2px solid var(--gold2);box-shadow:0 0 0 2px #2b1b08,0 6px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1)}
.lux-btn svg{width:22px;height:22px;flex:none}
.lux-btn small{font-family:system-ui;font-size:11px;color:var(--mut);letter-spacing:0}
.lux-btn:active,.lux-cta:active{transform:scale(.98)}
.lux-row{display:flex;gap:10px}.lux-row .lux-btn{font-size:13px;padding:12px 8px;gap:7px}
.lux-cta{position:relative;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;padding:17px 18px;border-radius:34px;font-weight:900;font-size:24px;letter-spacing:1.5px;color:#ffe6a0;background:radial-gradient(120% 140% at 50% 0%,#7a3aa5,#4a1d6e 45%,#2a0f42);border:3px solid var(--gold2);box-shadow:0 0 0 3px #3a2108,0 0 24px rgba(186,120,255,.35),0 10px 22px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.18);text-shadow:0 2px 0 #2a0b3c}
.lux-cta span{font-size:22px}
.soon{font-style:normal;font-family:system-ui;font-size:9px;font-weight:900;letter-spacing:1px;color:#2a1405;background:linear-gradient(180deg,var(--gold1),var(--gold2));border-radius:8px;padding:2px 6px;margin-left:4px;vertical-align:2px}

/* ---------- HOME ---------- */
.home.lux{position:relative;overflow:hidden;text-align:center;padding-top:calc(env(safe-area-inset-top) + 10px)}
.drape{position:fixed;top:0;bottom:0;width:22%;pointer-events:none;z-index:0;background:repeating-linear-gradient(90deg,rgba(90,20,40,.55) 0 14px,rgba(40,8,22,.75) 14px 26px);-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 95%);mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 95%);opacity:.55}
.drape.l{left:0;-webkit-mask-image:linear-gradient(90deg,#000 30%,transparent),linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(90deg,#000 30%,transparent)}
.drape.r{right:0;-webkit-mask-image:linear-gradient(270deg,#000 30%,transparent);mask-image:linear-gradient(270deg,#000 30%,transparent)}
.candle{position:fixed;width:120px;height:120px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(255,190,90,.55),rgba(255,140,40,.12) 45%,transparent 70%);animation:flicker 3s ease-in-out infinite}
.candle.c1{left:-30px;top:110px}.candle.c2{right:-30px;top:150px;animation-delay:1.2s}
@keyframes flicker{0%,100%{opacity:.8;transform:scale(1)}40%{opacity:1;transform:scale(1.06)}70%{opacity:.7}}
.home.lux>*{position:relative;z-index:1}
.corner-btns{display:flex;justify-content:space-between}
.fan{height:92px;position:relative;margin-top:-6px}
.fc{position:absolute;left:50%;top:12px;margin-left:-29px;width:58px;height:82px;border-radius:8px;background:linear-gradient(160deg,#fffaf0,#ecdcb8);border:2px solid var(--gold2);box-shadow:0 6px 14px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1d1a24;font-family:"Cinzel",serif;transform-origin:50% 120%}
.fc b{font-size:26px;line-height:1}.fc span{font-size:22px;line-height:1}.fc.red{color:#c41d34}
.fc.jk .star{color:#8b2fc9;font-size:28px}.fc.jk small{font-size:8px;font-weight:900;color:#8b2fc9;letter-spacing:1px}
.crest{position:relative;margin:-10px auto 0;width:min(320px,88%);padding:16px 10px 14px;border-radius:26px 26px 40px 40px;background:radial-gradient(120% 100% at 50% 0%,#3d1f5c,#1c0f2c 70%);border:3px solid var(--gold2);box-shadow:0 0 0 3px #3a2108,0 0 0 6px rgba(224,176,79,.35),0 14px 30px rgba(0,0,0,.6),inset 0 0 24px rgba(0,0,0,.6)}
.crest h1{margin:0!important;font-family:"Cinzel Decorative","Cinzel",serif!important;font-weight:900!important;font-size:52px!important;line-height:.95!important;letter-spacing:2px!important;color:transparent!important;background:linear-gradient(180deg,#fff3c8 0%,#f1c25c 45%,#b17a1f 75%,#ffe39a 100%);-webkit-background-clip:text;background-clip:text;text-shadow:none!important;filter:drop-shadow(0 3px 0 #3a1f08) drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.crest h1 span{display:block;font-size:64px!important;background:inherit;-webkit-background-clip:text;background-clip:text;filter:none!important}
.gem{position:absolute;left:50%;width:16px;height:16px;margin-left:-8px;transform:rotate(45deg);background:radial-gradient(circle at 35% 35%,#ff8ab0,#c2185b 60%,#6a0d33);border:2px solid var(--gold2);box-shadow:0 0 10px rgba(255,80,140,.6)}
.gem.t{top:-10px}.gem.b{bottom:-10px}
.home.lux .hero{margin-top:-8px}
.home.lux .tilt{width:112%;margin:-14% -6% -30%;animation:spin 80s linear infinite;-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent 100%);mask-image:linear-gradient(to bottom,#000 60%,transparent 100%)}
.home.lux .tag{font-family:"Cinzel",serif;font-weight:700;font-size:15px;letter-spacing:1.5px;line-height:1.35;color:var(--gold1);margin:0 0 4px;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.namebox{margin-top:18px;text-align:left}
.lbl{font-family:"Cinzel",serif;letter-spacing:1px;color:var(--gold2)!important;font-size:12px!important}
.txt{background:rgba(10,8,22,.7)!important;border:1.5px solid rgba(224,176,79,.55)!important;color:var(--txt)!important}

/* ---------- SETUP ---------- */
.setup.lux .nums{gap:8px;justify-content:center}
.setup.lux .nums button{width:50px;height:42px;border-radius:12px;font-weight:700;font-size:17px;color:var(--gold1);background:linear-gradient(180deg,#221c3e,#141028);border:1.5px solid rgba(224,176,79,.6)}
.setup.lux .nums button.on,.lseg button.on{color:#2a1405!important;background:linear-gradient(180deg,#ffe49a,#e7b04a 55%,#b67f22)!important;border-color:#fff0b8!important;box-shadow:0 0 12px rgba(255,200,90,.45)}
.seats{gap:8px!important}
.seat{gap:10px!important}
.orb{display:inline-block;flex:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95) 0 8%,var(--c) 38%,color-mix(in srgb,var(--c) 45%,#000) 100%);box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 -2px 4px rgba(0,0,0,.3)}
.namefield{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(10,8,22,.75);border:1.5px solid rgba(224,176,79,.5);border-radius:10px;padding:0 10px;color:var(--gold2)}
.namefield svg{width:16px;height:16px;flex:none}
.namefield input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font:600 15px system-ui;padding:9px 0}
.setup.lux .who{width:90px;border-radius:9px;font-size:12px;padding:7px 0;background:rgba(10,8,22,.75);border:1.5px solid rgba(224,176,79,.4);color:var(--mut)}
.setup.lux .who.h{color:var(--gold1);border-color:var(--gold2);background:linear-gradient(180deg,#2a2348,#161130)}
.lseg{display:flex;gap:0;background:rgba(10,8,22,.75);border:1.5px solid rgba(224,176,79,.55);border-radius:12px;padding:3px}
.lseg button{flex:1;padding:10px 4px;border-radius:9px;font-weight:700;font-size:15px;color:var(--txt)}
.otiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.otile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px 12px;border-radius:14px;background:linear-gradient(180deg,#201a3a,#120f24);border:1.5px solid rgba(224,176,79,.4);color:var(--gold1);text-align:center}
.otile>svg{width:36px;height:36px;color:var(--gold1)}
.otile b{font-size:14px;font-weight:700;color:var(--txt)}.otile span{font-size:11px;color:var(--mut)}
.otile .tick{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(224,176,79,.6);display:grid;place-items:center}
.otile .tick svg{width:12px;height:12px}
.otile.on{border-color:var(--gold2);box-shadow:0 0 0 1px var(--gold3),0 0 16px rgba(224,176,79,.3)}
.otile.on .tick{background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#2a1405;border-color:#fff0b8}
.otile.dis{opacity:.45}
.hint.center{text-align:center}
.rulesbtn2{margin:16px 0 110px}
.setup.lux .sticky{background:linear-gradient(transparent,var(--ink) 40%)}
.setup.lux .sticky .lux-cta{max-width:520px;margin:0 auto}
.team{border-radius:9px!important}

/* ---------- CARD RULES / HOW ---------- */
.rules.lux .hint{text-align:center}
.rules.lux .rrow{background:linear-gradient(180deg,#1f1938,#130f25);border:1.5px solid rgba(224,176,79,.45);border-radius:14px}
.rules.lux .rrow.open{border-color:var(--gold2)}
.rules.lux .rhead{display:grid;grid-template-columns:46px 1fr 16px;grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:10px 12px}
.rk{grid-row:span 2;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:24px;color:#1d1a24;background:linear-gradient(160deg,#fffaf0,#e8d3a6);border:2px solid var(--gold2);box-shadow:0 3px 6px rgba(0,0,0,.4)}
.rk.jk{color:#8b2fc9;font-size:26px}
.rules.lux .rhead b{font-family:"Cinzel",serif;font-size:16px;color:var(--gold1);text-transform:none}
.rules.lux .rhead span{font-size:12px;color:var(--mut);line-height:1.3}
.rules.lux .rhead>i{grid-row:span 2;color:var(--gold2)}
.rules.lux .ed{border-top:1px solid rgba(224,176,79,.3)}
.rules.lux .chip,.rules.lux .ghost{border-color:rgba(224,176,79,.5);color:var(--gold1);background:rgba(10,8,22,.7)}
.hstep{position:relative;display:flex;align-items:center;gap:12px;margin:0 0 12px 14px;padding:14px 14px 14px 30px;border-radius:14px;background:linear-gradient(180deg,#1f1938,#130f25);border:1.5px solid rgba(224,176,79,.45)}
.hstep .num{position:absolute;left:-14px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:900 17px "Cinzel",serif;color:#2a1405;background:radial-gradient(circle at 40% 30%,#fff1c2,#e3b04c 60%,#9c6a1c);border:2px solid #3a2108}
.hstep .hicon{flex:none;color:var(--gold1)}.hstep .hicon svg{width:34px;height:34px}
.hstep b{font-family:"Cinzel",serif;font-size:17px;color:var(--gold1)}
.hstep p{margin:4px 0 0;font-size:13px;line-height:1.4;color:#d9ccb1}
.howcards{display:flex;flex-direction:column;gap:8px}
.howcards>div{display:flex;align-items:center;gap:12px;font-size:13px;color:#d9ccb1}
.howcards .rk{width:36px;height:36px;font-size:18px}
.howcards p{margin:0}

/* ---------- GAME ---------- */
.game.lux{max-width:640px}
.game.lux .ghdr{padding:6px 10px 0}
.game.lux .topbar{padding:4px 6px;gap:4px}
.arrow{flex:none;width:22px;font-size:26px;color:var(--gold2);line-height:1}
.pchip{background:linear-gradient(180deg,#1f1938,#120f24)!important;border:1.5px solid rgba(224,176,79,.45)!important;color:var(--txt)}
.pchip i{width:14px!important;height:14px!important;box-shadow:inset -2px -2px 3px rgba(0,0,0,.4),inset 2px 2px 3px rgba(255,255,255,.4)}
.pchip.turn{border-color:#ff5a6a!important;box-shadow:0 0 0 1px #ff5a6a,0 0 12px rgba(255,90,106,.45)!important}
.lead{background:linear-gradient(180deg,var(--gold1),var(--gold2))!important}
.game.lux .boardwrap{position:relative;margin:4px 8px;border-radius:22px;border:2px solid rgba(224,176,79,.55);box-shadow:0 0 0 2px #2b1b08,inset 0 0 30px rgba(0,0,0,.6);overflow:hidden;padding:8px}
.felt{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#16585a,#0c3237 55%,#061a1e 100%)}
.felt:after{content:"";position:absolute;inset:0;opacity:.25;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:4px 4px}
#board{position:relative}
.game.lux .panel{background:none}
.status{display:grid!important;grid-template-columns:1fr auto;gap:8px 10px!important;align-items:stretch!important}
.status .last{grid-column:1/-1;justify-self:start;background:linear-gradient(180deg,#1f1938,#120f24);border:1.5px solid rgba(224,176,79,.4);border-radius:16px;padding:4px 12px;color:var(--txt)!important;font-size:13px!important}
.status .msg{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:54px;padding:8px 14px;border-radius:16px;background:radial-gradient(120% 140% at 50% 0%,#4a2170,#2a0f42 60%,#1a0a2b);border:2px solid var(--gold2);box-shadow:0 0 0 2px #2b1b08,0 6px 14px rgba(0,0,0,.45);font-size:14px!important;color:var(--txt)}
.status .msg:empty,.status .msg:has(> .skipban){background:none;border:0;box-shadow:none;padding:0}
.yt{font-weight:900;font-size:19px;letter-spacing:1.5px;color:var(--gold1)}
.ys{font-size:13px;color:#e8dcc4;font-weight:600}
button.deck{display:flex!important;align-items:center;gap:8px;border-radius:14px!important;background:linear-gradient(180deg,#1f1938,#120f24)!important;border:1.5px solid rgba(224,176,79,.55)!important;color:var(--txt)!important;font-size:12px!important;text-align:left!important}
button.deck svg{width:22px;height:22px;color:var(--gold2);flex:none}
.ob{background:linear-gradient(180deg,#221c3e,#141028)!important;border:1.5px solid rgba(224,176,79,.55)!important;color:var(--gold1)!important;border-radius:20px!important}
.ob.go{border-color:var(--gold2)!important}
/* parchment cards */
.hand .card{background:linear-gradient(165deg,#fffaf0 0%,#f3e5c6 60%,#e5cf9f 100%)!important;border:2px solid #d6a947;box-shadow:0 0 0 1px #6e4a12,0 6px 12px rgba(0,0,0,.5)!important;color:#1d1a24;font-family:"Cinzel",Georgia,serif!important}
.hand .card.red{color:#b5172f}
.hand .card.flat .rs b{font-weight:900}
.hand .card em{font-family:"Cinzel",Georgia,serif!important;color:#9b2335!important;font-weight:700;font-size:10.5px}
.hand .card:not(.red) em{color:#5b3a12!important}
.hand .card.joker em{color:#7a2ab0!important}
.cwrap.sel .card{box-shadow:0 0 0 3px #ffe08a,0 0 18px rgba(255,210,110,.6),0 8px 16px rgba(0,0,0,.5)!important}
.cwrap.dim .card{opacity:.45}
/* overlays */
.overlay{background:rgba(6,4,14,.82)!important}
.box,.lux-box{background:radial-gradient(120% 80% at 50% 0%,#2a1f48,#120f24 70%)!important;border:2px solid var(--gold2)!important;box-shadow:0 0 0 3px #2b1b08,0 20px 40px rgba(0,0,0,.6)!important;border-radius:22px!important}
.lux-box .ribbon{margin:0 auto}
.box .cta{background:radial-gradient(120% 140% at 50% 0%,#7a3aa5,#4a1d6e 45%,#2a0f42)!important;color:#ffe6a0!important;border:2px solid var(--gold2);font-family:"Cinzel",serif;border-radius:28px!important}
.box .ghost{border-color:rgba(224,176,79,.55)!important;color:var(--gold1)!important;background:rgba(10,8,22,.6)!important;border-radius:24px!important;font-family:"Cinzel",serif}
.box h2{color:var(--gold1)}
.settings{text-align:left}
.sgroup{background:rgba(10,8,22,.55);border:1.5px solid rgba(224,176,79,.4);border-radius:14px;padding:6px 12px}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(224,176,79,.15);color:var(--gold1);font-size:14px}
.srow:last-of-type{border-bottom:0}
.srow svg{width:20px;height:20px;flex:none}
.srow span{flex:1;color:var(--txt);font-weight:600}
.srow.col{flex-wrap:wrap}.srow.col .lseg,.srow.col .themes{flex-basis:100%;margin-top:8px}
.lsw{flex:none;width:46px;height:26px;border-radius:14px;background:#3b3450;position:relative;border:1px solid rgba(224,176,79,.4)}
.lsw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#e8e0d0;transition:.2s}
.lsw.on{background:linear-gradient(180deg,#5fe08f,#21a85a)}.lsw.on i{left:22px}
.lsw.dis{opacity:.55}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.theme{position:relative;aspect-ratio:1;border-radius:10px;border:2px solid rgba(224,176,79,.4)}
.theme.on{border-color:var(--gold1);box-shadow:0 0 10px rgba(255,210,110,.5)}

}

    const mm = sim.m[mover >> 2][mover & 3], dest = {z:mm.z, p:mover >> 2, i:mm.i};
    const path = [xy(mloc(mover))]; for (const e of ev) if (e.key === mover && !e.bump) path.push(...e.path.map(xy));

function ghostBadge(x, y, n, col){

}
function drawGhosts(){

  const num = lab => { const m = /(\d+)/.exec(lab || ''); return m ? m[1] : ''; };
  let s = '';

  if (sel.picks.length && card.split) {
    const mv = selMoves()[0];
    if (mv) { const sim = lightClone(G), ev = []; for (const op of mv.ops.slice(0, sel.picks.length)) applyOp(sim, op, ev);
      for (const pk of sel.picks) { const mm = sim.m[pk.key >> 2][pk.key & 3], [x, y] = xy({z:mm.z, p:pk.key >> 2, i:mm.i}), col = PAL[pk.key >> 2];
        s += `<circle cx="${x}" cy="${y}" r="${geom.mr}" fill="${col}" fill-opacity=".55" stroke="#fff" stroke-width="3" stroke-dasharray="5 4"/>` + ghostBadge(x, y, num(pk.label), col); } }

        <path d="M${x - hr * 1.9},${y}h${hr * .6}M${x + hr * 1.3},${y}h${hr * .6}M${x},${y - hr * 1.9}v${hr * .6}M${x},${y + hr * 1.3}v${hr * .6}" stroke="#ff4d4d" stroke-width="${Math.max(3, hr * .25)}" stroke-linecap="round"/></g>`;

let undoSnap = null;

// A "bink" (landing on someone and sending them back to start) gets a shake and a banner.
function dingFx(ev, mover){
  const hits = [...new Set(ev.filter(e => e.bump).map(e => e.key >> 2))];
  if (!hits.length || mover < 0) return;
  const meTeam = teamOf(G, viewer), mine = q => teamOf(G, q) === meTeam;
  const moverMine = mine(mover), hitMine = hits.filter(mine), hitOther = hits.filter(q => !mine(q));
  if (!moverMine && !hitMine.length) return;                       // nothing to do with you or your team
  const who = q => q === viewer ? 'you' : (G.set.partners && q === mateOf(G, viewer) ? 'your partner ' + pname(q) : pname(q));
  const list = qs => qs.map(who).join(' &amp; ');
  const by = mover === viewer ? 'You' : (G.set.partners && mover === mateOf(G, viewer) ? 'Your partner' : pname(mover));
  let cls, txt;
  if (moverMine && !hitMine.length) { cls = 'good'; txt = `${by} binked ${list(hitOther)}!`; }
  else if (moverMine) { cls = 'meh'; txt = hitMine.length === 1 && hitMine[0] === mover ? `${by} binked ${mover === viewer ? 'yourself' : 'themselves'}!` : `${by} binked ${list(hitMine)}!`; }
  else { cls = 'bad'; txt = `${by} binked ${list(hitMine)}!`; }
  txt = txt.charAt(0).toUpperCase() + txt.slice(1);
  const wrap = document.querySelector('.boardwrap');
  if (!wrap) return;
  wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
  wrap.querySelectorAll('.ding').forEach(x => x.remove());
  const b = document.createElement('div'); b.className = 'ding ' + cls; b.innerHTML = txt; wrap.appendChild(b);
  setTimeout(() => b.classList.add('out'), 1500); setTimeout(() => b.remove(), 2100);
}

// --------- animation ---------
function glide(el, pts, ms){
  // move smoothly along a list of points at steady speed (ease in/out over the whole trip)
  return new Promise(res => {
    const seg = []; let tot = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); seg.push(l); tot += l; }

      let d = e * tot, i = 0; while (i < seg.length - 1 && d > seg[i]) { d -= seg[i]; i++; }
      const r = seg[i] ? Math.min(1, d / seg[i]) : 1, A = pts[i], B = pts[i + 1] || A;
      const x = A[0] + (B[0] - A[0]) * r, y = A[1] + (B[1] - A[1]) * r;
      el.setAttribute('transform', `translate(${x} ${y})`);
      if (k < 1) requestAnimationFrame(f); else { const L = pts[pts.length - 1]; el.dataset.x = L[0]; el.dataset.y = L[1]; el.setAttribute('transform', `translate(${L[0]} ${L[1]})`); res(); }
    }
    requestAnimationFrame(f);
  });
}
function arcPts(A, B){
  // curved hop for jumps, swaps, getting out and going back to start
  const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy) || 1;

  return pts;
}
function drawTrail(pts, color, dashed){
  const g = document.getElementById('trails'); if (!g) return null;
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  el.setAttribute('points', pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '));
  el.setAttribute('class', 'trail'); el.setAttribute('stroke', color);
  el.setAttribute('stroke-width', Math.max(4, geom.hr * 0.55));
  if (dashed) el.setAttribute('stroke-dasharray', `${geom.hr * .5} ${geom.hr * .6}`);
  g.appendChild(el);
  const end = pts[pts.length - 1], dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  dot.setAttribute('cx', end[0]); dot.setAttribute('cy', end[1]); dot.setAttribute('r', geom.hr * 1.25);
  dot.setAttribute('class', 'trail'); dot.setAttribute('stroke', color); dot.setAttribute('stroke-width', 4); dot.setAttribute('fill', 'none');

function fadeTrails(){ document.querySelectorAll('#trails .trail').forEach(t => { t.classList.add('fade'); setTimeout(() => t.remove(), 1400); }); }
async function animate(ev){
  const sp = SPEEDS[G.set.speed] || SPEEDS.normal;
  if (document.hidden) { placeMarbles(); return; }
  for (let i = 0; i < ev.length; i++) {
    const grp = [ev[i]]; while (ev[i + 1] && ev[i + 1].sim) grp.push(ev[++i]);
    await Promise.all(grp.map(async g => {
      const el = document.getElementById('mb' + g.key); if (!el) return;
      el.parentNode.appendChild(el); el.classList.add('moving');
      const start = [+el.dataset.x, +el.dataset.y], color = PAL[g.key >> 2];
      let pts, ms;
      if (g.jump) { pts = arcPts(start, xy(g.path[g.path.length - 1])); ms = sp.jump * (g.bump ? 1.1 : 1.3); }
      else { pts = [start, ...g.path.map(xy)]; ms = Math.max(260, g.path.length * sp.hop); }
      if (!g.bump) drawTrail(pts, color, g.jump);
      await glide(el, pts, ms);

// --------- game loop ---------
function save(){ if (G) LS.set('st.game2', {G}); }
function nextHumanPasser(){ for (let p = 0; p < G.N; p++) if (G.players[p].human && G.passSel && G.passSel[p] === null) return p; return -1; }
function setViewer(p){
  if (p === viewer) return;
  if (humanCount() > 1 && !G.set.openHands) curtain = p;
  viewer = p;
}
function loop(){
  clearTimeout(aiTimer);
  if (!G || screen !== 'game') return;
  if (G.phase === 'over') { drawGame(); return; }
  if (G.phase === 'pass') {
    if (nextHumanPasser() >= 0) { setViewer(nextHumanPasser()); drawGame(); return; }
    // everyone human has passed: computers pass after a short "trading" beat
    drawGame();
    aiTimer = setTimeout(() => {
      if (screen !== 'game' || menuOpen) return;
      const before = G.hands[viewer].map(c => c.id), gave = G.passSel[viewer];
      const gaveCard = G.hands[viewer].find(c => c.id === gave);
      for (let p = 0; p < G.N; p++) if (G.phase === 'pass' && G.passSel[p] === null) choosePass(G, p, aiPass(G, p));
      const got = G.hands[viewer].find(c => !before.includes(c.id));
      if (gaveCard && got) trade = {gave:gaveCard, got, from:mateOf(G, viewer)};
      save(); loop();
    }, 1100);
    return;
  }
  const p = G.turn;
  if (shouldFold(G, p)) {
    if (G.players[p].human) setViewer(p);
    drawGame();
    const sp0 = SPEEDS[G.set.speed] || SPEEDS.normal;
    aiTimer = setTimeout(() => { if (screen !== 'game' || busy || menuOpen) return; sel = null; burnPick = false; foldHand(G, p); save(); loop(); }, G.players[p].human ? 1400 : sp0.ai);
    return;
  }
  if (G.players[p].human) { setViewer(p); drawGame(); return; }
  drawGame();
  const sp = SPEEDS[G.set.speed] || SPEEDS.normal;
  aiTimer = setTimeout(async () => {
    if (screen !== 'game' || busy) return;
    const d = aiDecide(G, p);
    busy = true;
    undoSnap = null;
    const ev = d.burn !== undefined ? burnCard(G, p, d.burn) : playMove(G, d.mv);
    if (ON.active) { lastEv = ev; save(); }   // online: everyone sees the computer's move right away
    drawGame();
    await animate(ev);
    if (d.mv) dingFx(ev, p);
    busy = false; save(); loop();
  }, sp.ai);
}
function pname(p){ return esc(G.players[p].name); }
function drawGame(){

  // chips

  chips.innerHTML = G.players.map((pl, p) => {
    const home = G.m[p].filter(m => m.z === 'h').length;
    const team = G.set.partners ? `<em>${String.fromCharCode(65 + (p % (G.N / 2)))}</em>` : '';
    const lead = G.phase === 'pass' && G.turn === p ? '<span class="lead">1st</span>' : '';
    return `<div class="pchip ${G.turn === p && G.phase !== 'over' ? 'turn' : ''}"><i style="background:${PAL[p]}"></i>${esc(pl.name)} <b>${home}/4</b>${team}${lead}</div>`;
  }).join('');
  const cur = chips.querySelector('.turn'); if (cur && cur.scrollIntoView) cur.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
  // whose turn: glow their start tray
  document.querySelectorAll('.sbox.on').forEach(e => e.classList.remove('on'));
  if (G.phase !== 'over') { const sb = document.getElementById('sb' + G.turn); if (sb) sb.classList.add('on'); }
  // highlights
  document.querySelectorAll('.mb.cand,.mb.picked').forEach(e => e.classList.remove('cand', 'picked'));
  if (myTurn() && sel) {
    for (const k of candidates()) document.getElementById('mb' + k).classList.add('cand');
    for (const pk of sel.picks) document.getElementById('mb' + pk.key).classList.add('picked');
    if (sel.from !== null && sel.from !== undefined) document.getElementById('mb' + sel.from).classList.add('picked');
    for (const k of swapTargets()) document.getElementById('mb' + k).classList.add('cand', 'target');
  }
  drawGhosts();
  // status + options
  const status = document.getElementById('status'), opts = document.getElementById('opts'), hand = document.getElementById('hand');
  const last = G.last ? `<div class="last"><i style="background:${PAL[G.last.p]}"></i>${pname(G.last.p)} ${/^(burned|was skipped|folded)/.test(G.last.text) ? '' : 'played '}${esc(G.last.text)}</div>` : '';
  let msg = '', ob = '';
  const moves = G.phase === 'play' ? allMoves(G, viewer) : [];
  const burnable = G.phase === 'play' && canBurn(G, viewer, moves);
  if (G.phase === 'over') msg = '';
  else if (curtain !== null) msg = '';
  else if (G.phase === 'pass') msg = (G.passSel && G.passSel[viewer] === null ? `Pick a card to pass to your partner, <b>${pname(mateOf(G, viewer))}</b>` : `<span class="pill"><i style="background:${PAL[G.turn]}"></i>Dealing &amp; trading…</span>`)
    + `<div class="first"><i style="background:${PAL[G.turn]}"></i>${G.turn === viewer ? 'You go first this hand' : pname(G.turn) + ' goes first this hand'}</div>`;
  else if (G.turn === viewer && shouldFold(G, viewer)) msg = 'No way to get a marble out this hand. Folding…';
  else if (!myTurn()) msg = busy ? '&nbsp;' : G.turn === viewer ? '&nbsp;' : `<span class="dots">${pname(G.turn)} is thinking</span>`;
  else if (G.turn === viewer && shouldFold(G, viewer)) msg = 'No way to get a marble out this hand. Folding…';
  else if (G.forced === viewer && G.turn === viewer) {
    const by = G.last && G.last.did && /^skipped/.test(G.last.did) ? pname(G.last.p) : 'Someone';
    msg = `<div class="skipban"><b>⏭ ${by} skipped you!</b><span>Choose a card to discard.</span></div>`;
  }
  else if (moves.length === 0) msg = 'No moves. Tap a card to burn it.';
  else if (burnPick) { msg = 'Tap the card you want to burn.'; ob = `<button class="ob" data-a="burncancel">Cancel</button>`; }
  else if (!sel && moves.every(m => m.optional)) msg = 'None of your marbles can move. Play a special card, or burn one.';
  else if (!sel) msg = `<b class="yt">YOUR TURN</b><span class="ys">${allHome(G, viewer) && G.set.partners ? `You’re home! Now moving ${pname(mateOf(G, viewer))}’s marbles.` : 'Pick a card to play.'}</span>`;
  else {
    const step = sel.picks.length, cmoves = genMoves(G, viewer, sel.h), acts = cmoves.filter(m => m.action);
    if (sel.ghosts && sel.swapLab) msg = sel.ghosts.length ? 'Tap a marble to swap with, or the spot to move to.' : 'Tap the marble to swap with.';
    else if (sel.ghosts) msg = sel.picks.length && G.cfg[G.hands[viewer][sel.h].r].split ? `Tap how far this one goes (${G.cfg[G.hands[viewer][sel.h].r].n - splitUsed()} left).` : sel.ghosts.length > 1 ? 'Tap where you want it to go.' : 'Tap the spot to confirm the move.';
    else if (step === 0) { msg = acts.length && acts.length === cmoves.length ? 'Play this card to:' : acts.length ? 'Tap a glowing marble, or:' : 'Tap a glowing marble.';
      ob = acts.map(m => `<button class="ob go" data-a="act" data-l="${esc(m.action)}">${esc(m.action)}</button>`).join(''); }
    else msg = `${G.cfg[G.hands[viewer][sel.h].r].n - splitUsed()} left to move. Tap another marble.`;
    ob += `<button class="ob" data-a="cancel">${sel.ghosts || sel.swapLab || sel.picks.length ? '↩ Undo' : 'Cancel'}</button>`;
  }
  if (myTurn() && burnable && moves.length && !burnPick && !sel) ob += `<button class="ob go" data-a="burnmode">🔥 Burn a card instead</button>`;
  if (trade && G.phase === 'play') ob = `<div class="toast"><span>🔄 You passed <b>${cardName(trade.gave)}</b> and got <b>${cardName(trade.got)}</b> from ${pname(trade.from)}</span><button data-a="toastx">✕</button></div>` + ob;
  status.innerHTML = last + `<div class="msg">${msg}</div><button class="deck" data-a="log">${ICON.stack}<span>${G.deck.length} in deck<br>${Math.max(0, (G.shuffleSize || 0) - G.deck.length - G.hands.reduce((s, h) => s + h.length, 0))} played</span></button>`;
  opts.innerHTML = ob;
  // hand
  if (curtain !== null || !G.players[viewer].human) hand.innerHTML = '';
  else if (G.phase === 'pass' && G.passSel && G.passSel[viewer] !== null) hand.innerHTML = `<div class="waiting"><span class="dots">Dealing &amp; trading</span><small>${pname((G.dealer + 1) % G.N)} leads this hand</small></div>`;
  else {
    const passing = G.phase === 'pass' && G.passSel && G.passSel[viewer] === null;
    hand.innerHTML = G.hands[viewer].map((c, h) => {
      const playable = myTurn() && (moves.some(m => m.h === h) || moves.length === 0 || burnPick);
      const cls = [G.forced === viewer && myTurn() ? 'discard' : '', sel && sel.h === h ? 'sel' : '', (myTurn() || passing) && !playable && !passing ? 'dim' : '', !myTurn() && !passing ? 'wait' : ''].join(' ');
      return `<button class="cwrap ${cls}" data-a="card" data-h="${h}">${cardFace(c.r, c.s, '', cardNote(G.cfg[c.r]))}</button>`;
    }).join('');
  }
  if (false) {
    hand.innerHTML += `<div class="openh">${G.players.map((pl, p) => p === viewer ? '' : `<span><i style="background:${PAL[p]}"></i>${G.hands[p].map(c => cardName(c)).join(' ') || '—'}</span>`).join('')}</div>`;
  }
  // overlay
  const ov = document.getElementById('overlay');
  if (settingsOpen && G.phase !== 'over') {
    ov.className = 'overlay show'; ov.innerHTML = settingsHTML();
  } else if (logOpen && !menuOpen && G.phase !== 'over') {
    const sc = ov.querySelector('.plays'), y = sc ? sc.scrollTop : 0;
    ov.className = 'overlay show'; ov.innerHTML = logHTML();
    const sc2 = ov.querySelector('.plays'); if (sc2) sc2.scrollTop = y;
  } else if (menuOpen) {
    ov.className = 'overlay show';
    ov.innerHTML = `<div class="box lux-box">${ribbon('SUPER TOCK', 'sm')}<h2 class="ltitle"><i></i>PAUSED<i></i></h2><button class="cta" data-a="mresume">Keep playing</button><button class="ghost wide" data-a="mrules">See card rules</button><button class="ghost wide" data-a="mquit">Back to menu</button><p class="hint">Your game is saved. Resume it from the menu any time.</p></div>`;
  } else if (G.phase === 'over') {
    ov.className = 'overlay show win';
    ov.innerHTML = winHTML(G.winner);
  } else if (curtain !== null) {
    ov.className = 'overlay show';
    ov.innerHTML = `<div class="box"><i class="big" style="background:${PAL[curtain]}"></i><h2>Pass to ${pname(curtain)}</h2><p>${G.phase === 'pass' ? 'Time to pass a card to your partner.' : 'It’s your turn.'}</p><button class="cta" data-a="reveal">I’m ${pname(curtain)}, show my cards</button></div>`;
  } else { ov.className = 'overlay'; ov.innerHTML = ''; }
}

    cv.getContext('2d').drawImage(img, sx, sy, m, m, 0, 0, S, S);

  };
  img.src = url;
});
app.addEventListener('input', e => {

  if (t.dataset.in === 'seat') { const x = setup.seats[+t.dataset.i]; x.name = t.value; if (x.human && +t.dataset.i === 0) { profile.name = t.value; LS.set('st.profile', profile); } }

app.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t || !t.dataset.a) return;
  const a = t.dataset.a, d = t.dataset;
  switch (a) {
    case 'home': screen = 'home'; render(); break;
    case 'setup': setup = defaultSetup(d.mode); screen = 'setup'; render(); break;
    case 'online': flash('Online play is the next stage, coming soon.'); break;
    case 'how': screen = 'how'; render(); break;
    case 'rules': rulesReturn = d.from || 'home'; openRank = null; screen = 'rules'; render(); break;
    case 'n': setup.n = +d.v; fitSeats(setup); render(); break;
    case 'who': setup.seats[+d.i].human = !setup.seats[+d.i].human; if (!setup.seats[+d.i].human && /^Player \d+$/.test(setup.seats[+d.i].name)) setup.seats[+d.i].name = CNAMES[+d.i]; render(); break;
    case 'set': setup[d.k] = d.v; render(); break;
    case 'tog': setup[d.k] = !setup[d.k]; if (d.k === 'photo') { LS.set('st.photoOn', setup.photo); _hero = null; } if (d.k === 'partners' && setup.partners && !teamsOk(setup)) resetTeams(setup); render(); break;
    case 'team': { const x = setup.seats[+d.i]; x.team = (x.team + 1) % (setup.n / 2); render(); break; }
    case 'start': startGame(); break;
    case 'resume': { const s = LS.get('st.game2', null); if (s && s.G && s.G.v === 3) { G = s.G; sel = null; curtain = null; busy = false; burnPick = false; menuOpen = false; viewer = G.players.findIndex(p => p.human); if (viewer < 0) viewer = 0; screen = 'game'; render(); } break; }
    // rules editor
    case 'ropen': openRank = openRank === d.r ? null : d.r; render(); if (openRank) { const el = document.getElementById('rr-' + openRank); if (el) el.scrollIntoView({block:'start'}); } break;
    case 'rset': { rules[openRank][d.k] = d.v; saveRules(); render(); keepScroll(); break; }
    case 'rflag': { const c = rules[openRank]; c[d.k] = !c[d.k]; if (d.k === 'split' && c.split && c.n < 2) c.n = 2; saveRules(); render(); keepScroll(); break; }
    case 'act': { const mv = genMoves(G, viewer, sel.h).find(m => m.action === d.l); if (mv) { sel = null; doMove(mv); } break; }
    case 'rstep': { const c = rules[openRank]; c[d.k] = Math.max(0, (c[d.k] || 0) + +d.d); saveRules(); render(); keepScroll(); break; }
    case 'rreset1': rules[openRank] = cloneCfg(CLASSIC[openRank]); saveRules(); render(); keepScroll(); break;
    case 'rclassic': rules = cloneCfg(CLASSIC); saveRules(); flash('Ron’s Rules loaded'); render(); break;
    case 'rload': rules = fixCfg(savedSets[+d.i].cfg); saveRules(); flash(`Loaded “${savedSets[+d.i].name}”`); render(); break;
    case 'rdel': savedSets.splice(+d.i, 1); LS.set('st.sets2', savedSets); render(); break;
    case 'rsave': { const nm = (document.getElementById('setname').value || '').trim(); if (!nm) { flash('Give your rule set a name first'); break; }
      const i = savedSets.findIndex(s => s.name === nm); const entry = {name:nm, cfg:cloneCfg(rules)}; if (i >= 0) savedSets[i] = entry; else savedSets.push(entry);
      LS.set('st.sets2', savedSets); flash(`Saved “${nm}”`); render(); break; }
    case 'rback': screen = rulesReturn === 'game' ? 'game' : rulesReturn; if (screen === 'game') { setPal(); app.innerHTML = gameSkeleton(); buildBoard(); loop(); } else render(); break;
    // game
    case 'card': onCard(+d.h); break;
    case 'cancel': if (sel && (sel.ghosts || sel.swapLab)) { sel.ghosts = null; sel.from = null; sel.swapLab = null; } else if (sel && sel.picks.length) { sel.picks = []; } else sel = null; drawGame(); break;
    case 'undomove': if (undoSnap) { clearTimeout(aiTimer); G = JSON.parse(undoSnap); undoSnap = null; sel = null; trade = null; busy = false; buildBoard(); save(); loop(); } break;
    case 'toastx': trade = null; drawGame(); break;
    case 'burnmode': burnPick = true; sel = null; drawGame(); break;
    case 'burncancel': burnPick = false; drawGame(); break;
    case 'reveal': curtain = null; drawGame(); break;
    case 'gmenu': menuOpen = true; clearTimeout(aiTimer); drawGame(); break;
    case 'mresume': menuOpen = false; loop(); break;
    case 'photoreset': LS.del('st.photo'); _hero = null; render(); break;
    case 'mquit': menuOpen = false; clearTimeout(aiTimer); if (G && G.phase === 'over') LS.del('st.game2'); screen = 'home'; render(); break;
    case 'mrules': menuOpen = false; showGameRules(); break;
    case 'log': if (G) showLog(); break;
    case 'logx': logOpen = false; drawGame(); break;
    case 'mvib': vibOn = !vibOn; LS.set('st.vib', vibOn); if (vibOn) vib(20); drawGame(); break;
    case 'again': startGame(true); break;
    case 'closeov': drawGame(); break;
  }
});

function saveRules(){ LS.set('st.rules2', rules); }
function onCard(h){
  if (curtain !== null || busy) return;
  if (G.phase === 'pass') { if (G.passSel && G.passSel[viewer] === null) { choosePass(G, viewer, h); save(); loop(); } return; }
  if (!myTurn()) return;
  const moves = allMoves(G, viewer);
  if (moves.length === 0 || burnPick) { doBurn(viewer, h); return; }
  if (!moves.some(m => m.h === h)) { flash('That card has no legal move right now'); return; }
  sel = sel && sel.h === h ? null : {h, picks:[], ghosts:null, from:null};
  trade = null;
  drawGame();
}
let logOpen = false;
function showLog(){ logOpen = true; drawGame(); }
function logHTML(){
  const rows = []; let lastHand = null;
  for (const e of G.log.slice().reverse()) {
    if (e.hand !== undefined && e.hand !== lastHand) { rows.push(`<li class="lh">Hand ${e.hand}</li>`); lastHand = e.hand; }
    const card = e.card ? `<span class="lc ${e.card.s === '♥' || e.card.s === '♦' ? 'red' : ''}">${cardName(e.card)}</span>` : '';
    const what = e.did || e.text.replace(/^.*?·\s*/, '');
    const hit = e.hit && e.hit.length ? ` <span class="hit">sent back: ${e.hit.map(esc).join(', ')}</span>` : '';
    rows.push(`<li><i style="background:${PAL[e.p]}"></i><b>${pname(e.p)}</b>${card}<span>${esc(what)}</span>${hit}</li>`);
  }
  return `<div class="box tall log"><h2>Recent plays</h2>${rows.length ? `<ul class="plays">${rows.join('')}</ul>` : '<p>No plays yet.</p>'}<button class="cta" data-a="logx">Back to game</button></div>`;

}
function startGame(again){
  let players, set, cfg;
  if (again && G) { players = G.players; set = G.set; cfg = G.cfg; }
  else {
    if (!setup.seats.some(x => x.human)) { flash('Make at least one seat Human'); return; }
    let order = setup.seats.map((x, i) => i);
    if (setup.partners && setup.n % 2 === 0) {
      if (!teamsOk(setup)) { flash('Each team needs exactly 2 players'); return; }
      const half = setup.n / 2, teams = [];
      setup.seats.forEach((x, i) => { (teams[x.team] = teams[x.team] || []).push(i); });
      teams.sort((A, B) => Math.min(...A) - Math.min(...B));   // your team keeps the first seat
      order = new Array(setup.n);
      teams.forEach((t, k) => { order[k] = t[0]; order[k + half] = t[1]; });
    }
    players = order.map(i => ({name: (setup.seats[i].name || '').trim() || CNAMES[i], human: setup.seats[i].human, color: i}));
    set = {partners: setup.partners && setup.n % 2 === 0, hop: false, around: false, photo: setup.photo, center: setup.center, openHands: false, level: setup.level, speed: setup.speed, decks: 'auto', jokers: setup.jokers};
    cfg = rules;
  }
  G = newGame({players, set, cfg});
  sel = null; curtain = null; busy = false; burnPick = false; menuOpen = false; undoSnap = null; trade = null;
  viewer = G.players.findIndex(p => p.human);
  if (humanCount() > 1 && !G.set.openHands) curtain = null;
  save();
  screen = 'game'; render();
}
