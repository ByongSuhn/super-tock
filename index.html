    else if (r.i.watch && r.i.watch !== ON.code) act = `<button class="frbtn" data-a="frwatch" data-c="${esc(r.i.watch)}" data-p="${esc(r.i.p.pid || '')}">Watch</button>`;
    return `<div class="frrow"><i class="frdot ${r.i.dot}"></i><span class="nm"><b>${esc(r.name)}</b><small>${r.i.txt}</small></span>${act}</div>`;
  };
  const list = rows.length ? rows.map(row).join('') : '<p class="hint center">No friends yet. Add your buddies by their Super Tock username.</p>';
  return `<div class="mpicker" data-a="frclose"><div class="mbox frbox" data-a="noop">${head}
    <form class="cform fradd" id="fradd"><input id="frin" maxlength="14" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Add a friend by username"><button type="submit">Add</button></form>
    ${FR.msg ? `<p class="frmsg">${esc(FR.msg)}</p>` : ''}
    ${req}
    ${Object.keys(FR.sent).filter(u => !FR.list[u]).length ? `<h3 class="lh3">WAITING ON THEM</h3>${Object.entries(FR.sent).filter(([u]) => !FR.list[u]).map(([u, n]) => `<div class="frrow"><i class="frdot off"></i><span class="nm"><b>${esc(n)}</b><small>Friend request sent</small></span><button class="frbtn x" data-a="frcancel" data-u="${esc(u)}">Cancel</button></div>`).join('')}` : ''}
    <div class="frhead"><h3 class="lh3">YOUR FRIENDS${rows.length ? ` · ${frOnlineCount()} ON` : ''}</h3>${rows.length ? `<button class="frbtn sm" data-a="fredit">${FR.edit ? 'Done' : 'Edit'}</button>` : ''}</div>
    <div class="frlist">${list}</div>
    <p class="hint center">${inLobby ? 'Tap Invite and they’ll get a pop-up to join your game.' : 'Watch any game your friends are playing. To play together, host a game and invite them.'}</p>
  </div></div>`;
}
function frRedraw(){
  badgeFriends();
  if (!FR.open) return;
  let el = document.getElementById('friends');
  if (!el) { el = document.createElement('div'); el.id = 'friends'; document.body.appendChild(el); }
  const inp = el.querySelector('#frin'), keep = inp ? inp.value : '', focused = inp && document.activeElement === inp;
  el.innerHTML = friendsHTML();
  const ni = el.querySelector('#frin'); if (ni) { ni.value = keep; if (focused) ni.focus(); }
  const f = el.querySelector('#fradd'); if (f) f.addEventListener('submit', ev => { ev.preventDefault(); frAdd(ni.value); });
}
function frClose(){ FR.open = false; FR.edit = false; FR.msg = ''; const el = document.getElementById('friends'); if (el) el.remove(); }
function badgeFriends(){
  const n = FR.uid ? frRequests().length : 0, on = FR.uid ? frOnlineCount() : 0;
  document.querySelectorAll('[data-a="fropen"]').forEach(b => {
    let e = b.querySelector('.frbadge');
    const v = n || (b.classList.contains('cbtn') ? on : 0);
    if (!v) { if (e) e.remove(); return; }
    if (!e) { e = document.createElement('em'); b.appendChild(e); }
    e.className = 'frbadge' + (n ? '' : ' on'); e.textContent = v;
  });
}

// ---------- adding and removing ----------
async function frAdd(name){
  name = String(name || '').trim();
  if (!nameOk(name)) { FR.msg = 'Usernames are 3–14 letters, numbers or _'; frRedraw(); return; }
  if (ME && nameKey(name) === nameKey(ME.name)) { FR.msg = 'That’s you!'; frRedraw(); return; }
  FR.msg = 'Looking…'; frRedraw();
  let all;
  try { all = (await withTimeout(firebase.database().ref('users').once('value'), 8000)).val() || {}; }
  catch (e) { FR.msg = 'Couldn’t reach the server. Try again.'; frRedraw(); return; }
  const hit = Object.entries(all).find(([uid, u]) => u && u.name && nameKey(u.name) === nameKey(name));
  if (!hit) { FR.msg = `No player called “${name}”`; frRedraw(); return; }
  const [uid, u] = hit;
  if (FR.list[uid]) { FR.msg = `${u.name} is already your friend`; frRedraw(); return; }
  if (FR.sent[uid]) { FR.msg = `Already waiting on ${u.name} to accept`; frRedraw(); return; }
  await frRequest(uid, u.name);
  FR.msg = FR.list[uid] ? `You and ${u.name} are now friends` : `Request sent to ${u.name}`; frRedraw();
  const i = document.getElementById('frin'); if (i) i.value = '';
}
// a friend request: they show up on your list once they accept
async function frRequest(uid, name){
  const theirs = frRequests().find(x => x.f === uid);
  if (theirs) { await frAccept(uid, theirs.n || name, theirs.k); return; }   // they already asked you
  FR.sent[uid] = name;
  await NET.write(`${frPath.sent(ME.uid)}/${uid}`, name);
  NET.add(frPath.inbox(uid), {t:'add', f:ME.uid, n:ME.name, at:Date.now()});
}
async function frAccept(uid, name, k){
  FR.list[uid] = name || 'Player';
  await NET.write(`${frPath.list(ME.uid)}/${uid}`, name || 'Player');
  NET.add(frPath.inbox(uid), {t:'ok', f:ME.uid, n:ME.name, at:Date.now()});
  if (k) NET.del(`${frPath.inbox(ME.uid)}/${k}`);
  if (FR.sent[uid]) NET.del(`${frPath.sent(ME.uid)}/${uid}`);
}
function frRemove(uid){
  NET.del(`${frPath.list(ME.uid)}/${uid}`);
  NET.add(frPath.inbox(uid), {t:'rm', f:ME.uid, at:Date.now()});
}

// ---------- add straight from the leaderboard ----------
function lbFriendBtn(x){
  if (!FR_ON || !ME || x.uid === ME.uid) return '';
  if (FR.list[x.uid]) return '<span class="lbfr ok">Friends ✓</span>';
  if (FR.sent[x.uid]) return '<span class="lbfr wait">Requested</span>';
  return `<button class="lbfr" data-a="lbadd" data-u="${esc(x.uid)}" data-n="${esc(x.name)}">+ Add</button>`;
}
async function frAddUid(uid, name){
  if (!ME || !uid || uid === ME.uid || FR.list[uid] || FR.sent[uid]) return;
  await frRequest(uid, name); render();
  flash(FR.list[uid] ? `You and ${name} are now friends` : `Friend request sent to ${name}`);
}

// ---------- invites ----------
function frInvite(uid){
  if (!ON.L || ON.L.started) return;
  NET.add(frPath.inbox(uid), {t:'inv', f:ME.uid, n:ME.name, c:ON.code, at:Date.now()});
  FR.invd[uid] = Date.now(); frRedraw();
  flash('Invite sent');
}
function frInbox(){
  const now = Date.now();
  for (const [k, x] of Object.entries(FR.inbox)) {
    if (!x) continue;
    if (FR.done.has(k)) continue;
    const del = () => { FR.done.add(k); NET.del(`${frPath.inbox(FR.uid)}/${k}`); };
    if (x.t === 'add' && FR.list[x.f]) { NET.add(frPath.inbox(x.f), {t:'ok', f:FR.uid, n:ME.name, at:now}); del(); }   // already friends: remind them
    else if (x.t === 'add' && FR.sent[x.f]) { FR.done.add(k); frAccept(x.f, x.n, k); }                                                     // you both asked
    else if (x.t === 'ok') {
      if (FR.sent[x.f] || FR.list[x.f]) { if (!FR.list[x.f]) { flash(`${x.n || 'Your friend'} accepted your friend request`); FR.msg = ''; } FR.list[x.f] = x.n || FR.sent[x.f]; NET.write(`${frPath.list(FR.uid)}/${x.f}`, x.n || FR.sent[x.f]); NET.del(`${frPath.sent(FR.uid)}/${x.f}`); }
      del();
    }
    else if (x.t === 'no') { NET.del(`${frPath.sent(FR.uid)}/${x.f}`); del(); }
    else if (x.t === 'rm') { NET.del(`${frPath.list(FR.uid)}/${x.f}`); del(); }
    if (x.t === 'inv' && now - (x.at || 0) > INV_LIFE) NET.del(`${frPath.inbox(FR.uid)}/${k}`);
  }
  frRedraw(); drawBanner();
}
function nextInvite(){
  const now = Date.now();
  return Object.entries(FR.inbox).map(([k, x]) => Object.assign({k}, x))
    .filter(x => x.t === 'inv' && now - (x.at || 0) < INV_LIFE && !FR.gone.has(x.k) && x.c !== ON.code)
    .sort((a, b) => b.at - a.at)[0] || null;
}
function busyPlaying(){ return screen === 'game' && G && G.phase !== 'over' && !(ON.active && ON.spec); }
function drawBanner(){
  let el = document.getElementById('frban');
  const inv = FR.uid && !busyPlaying() ? nextInvite() : null;
  if (!inv) { if (el) el.remove(); FR.banner = null; return; }
  if (FR.banner === inv.k && el) return;
  FR.banner = inv.k;
  if (!el) { el = document.createElement('div'); el.id = 'frban'; document.body.appendChild(el); }
  el.innerHTML = `<div class="frban"><span class="ic">🎲</span><span class="tx"><b>${esc(inv.n || 'A friend')}</b> invited you to a game</span>
    <button class="frbtn go" data-a="frbjoin" data-k="${esc(inv.k)}" data-c="${esc(inv.c)}">Join</button><button class="frbtn x" data-a="frbx" data-k="${esc(inv.k)}">✕</button></div>`;
  vib([30, 40, 30]);
}

// ---------- joining or watching a friend ----------
async function leaveCurrent(){
  if (!ON.active) return;
  const L = ON.L;
  if (!ON.host && L && !L.started) sendLobbyIntent('leave', {});
  else if (ON.host && L && !L.started) NET.del(`games/${L.code}`);
  onlineReset();
}
async function frGo(code, watchPid){
  if (!code) return;
  if (busyPlaying() && !ON.spec) { flash('Finish your game first'); return; }
  if (!(profile.name || '').trim() && ME) { profile.name = ME.name; LS.set('st.profile', profile); }
  frClose();
  await leaveCurrent();
  screen = 'online';
  WATCH_PID = watchPid || null;
  await joinGame(code);
  if (!ON.active) { WATCH_PID = null; screen = 'home'; render(); flash('That game isn’t around anymore'); return; }
  if (screen === 'lobby' && ON.L && !ON.L.started && !watchPid && ON.L.seats.findIndex(x => x.pid === ON.pid) < 0) {
    const open = ON.L.seats.findIndex(x => x.kind === 'open');
    if (open >= 0) sendLobbyIntent('sit', {seat:open}); else flash('That table is full. You can still watch.');
  }
}

// ---------- taps ----------
window.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, d = t.dataset;
  if (a === 'fropen') { e.stopPropagation(); e.preventDefault(); if (typeof playMenu !== 'undefined' && playMenu) { playMenu = false; drawPlayMenu(); } FR.open = true; FR.msg = ''; frStart(); frRedraw(); return; }
  if (a === 'lbadd') { e.stopPropagation(); frStart(); frAddUid(d.u, d.n); return; }
  if (!t.closest('#friends, #frban')) return;
  if (a === 'frclose') { e.stopPropagation(); frClose(); }
  else if (a === 'noop') { e.stopPropagation(); }
  else if (a === 'fredit') { e.stopPropagation(); FR.edit = !FR.edit; frRedraw(); }
  else if (a === 'frdel') { e.stopPropagation(); frRemove(d.u); }
  else if (a === 'frcancel') { e.stopPropagation(); NET.del(`${frPath.sent(ME.uid)}/${d.u}`); }
  else if (a === 'fraccept') { e.stopPropagation(); frAccept(d.u, d.n, d.k); }
  else if (a === 'frdeny') { e.stopPropagation(); NET.del(`${frPath.inbox(ME.uid)}/${d.k}`); NET.add(frPath.inbox(d.u), {t:'no', f:ME.uid, at:Date.now()}); }
  else if (a === 'frinv') { e.stopPropagation(); frInvite(d.u); }
  else if (a === 'frwatch') { e.stopPropagation(); frGo(d.c, d.p || null); }
  else if (a === 'frbx') { e.stopPropagation(); FR.gone.add(d.k); NET.del(`${frPath.inbox(ME.uid)}/${d.k}`); drawBanner(); }
  else if (a === 'frbjoin') { e.stopPropagation(); FR.gone.add(d.k); NET.del(`${frPath.inbox(ME.uid)}/${d.k}`); drawBanner(); frGo(d.c, null); }
  else if (a === 'profile') { e.stopPropagation(); frClose(); screen = 'profile'; render(); }
}, true);

// ---------- hooks ----------
const _renderFR = render;
render = function(){
  _renderFR();
  if (ME && FR_ON && FR.uid !== ME.uid) frStart();
  else if (!ME && FR.uid) frStop();
  frBeat(false); badgeFriends(); drawBanner();
  if (FR.open) frRedraw();
};
const _drawGameFR = drawGame;
drawGame = function(){ _drawGameFR(); frBeat(false); };
// a Friends button on the Play menu and the Online screen
const _playMenuFR = playMenuHTML;
playMenuHTML = function(){
  const h = _playMenuFR();
  const n = FR.uid ? frOnlineCount() : 0, r = FR.uid ? frRequests().length : 0;
  const btn = `<button class="pmopt" data-a="fropen">${r ? `<em class="frbadge">${r}</em>` : ''}<i>${ICON.user}</i><span><b>FRIENDS</b><small>${n ? `${n} online now` : 'Invite, join or watch your friends'}</small></span></button>`;
  return h.replace('<button class="lux-btn" data-a="pmclose">', btn + '<button class="lux-btn" data-a="pmclose">');
};
// a Friends button up top on the home screen, next to Trophies
const _homeFR = homeHTML;
homeHTML = function(){
  const h = _homeFR();
  const r = FR.uid ? frRequests().length : 0, n = FR.uid ? frOnlineCount() : 0;
  const badge = r ? `<em class="frbadge">${r}</em>` : n ? `<em class="frbadge on">${n}</em>` : '';
  return h.replace(/(<button class="cbtn gold" data-a="trophies"[^>]*>[\s\S]*?<\/button>)/, `<span class="cgrp"><button class="cbtn gold" data-a="fropen" aria-label="Friends">${ICON.people}${badge}</button>$1</span>`);
};
const _onlineFR = onlineHTML;
onlineHTML = function(){
  const h = _onlineFR();
  if (!NET) return h;
  return h.replace('<h3 class="lh3">JOIN A GAME</h3>', `<button class="lux-btn" data-a="fropen">${ICON.user}<span>FRIENDS</span></button><h3 class="lh3">JOIN A GAME</h3>`);
};
render();

// ===================== Bink emojis: pick the emoji that pops up when you bink someone =====================
const BINKS = [
  {id:'boom', e:'💥', name:'Boom', line:'Boom. Back to start.'},
  {id:'taxi', e:'🚕', name:'Taxi Home', line:'Your ride’s here.'},
  {id:'skull', e:'💀', name:'Rest in Peace', line:'Rest in peace.'},
  {id:'wave', e:'👋', name:'Bye Bye', line:'Bye bye!'},
  {id:'lol', e:'😂', name:'LOL', line:'I can’t even.'},
  {id:'trash', e:'🗑️', name:'Taken Out', line:'Taking out the trash.'},
  {id:'rocket', e:'🚀', name:'Launched', line:'Sent to the moon.'},
  {id:'target', e:'🎯', name:'Bullseye', line:'Right on target.'},
  {id:'broom', e:'🧹', name:'Swept', line:'Clean sweep.'},
  {id:'clown', e:'🤡', name:'Clowned', line:'Get clowned.'},

];
const BINK = id => BINKS.find(b => b.id === id) || null;
if (profile.emo === undefined) profile.emo = 'boom';

// computers get a random one each game
const _newGameE = newGame;
newGame = function(opts){
  const st = _newGameE(opts);
  st.players.forEach(pl => {
    if (!pl.human) pl.emo = BINKS[Math.floor(Math.random() * BINKS.length)].id;     // a fresh one every game, rematches too
    else if (!pl.emo || !BINK(pl.emo)) pl.emo = 'boom';
  });
  return st;
};

// ---------- the pop-up ----------
const _dingFxE = dingFx;
dingFx = function(ev, mover){
  _dingFxE(ev, mover);
  try {
    const wrap = document.querySelector('.boardwrap'), ban = wrap && wrap.querySelector('.ding:not(.out)');
    const pl = G && G.players[mover], b = pl && BINK(pl.emo);
    if (!ban || !b || ban.dataset.emo) return;
    const hits = new Set(ev.filter(e => e.bump).map(e => e.key >> 2)).size;
    ban.dataset.emo = 1;
    ban.insertAdjacentHTML('beforeend', `<span class="dline">“${esc(b.line)}”</span>`);
    wrap.querySelectorAll('.cele').forEach(x => x.remove());
    const c = document.createElement('div'); c.className = 'cele' + (hits >= 2 ? ' big' : ''); c.textContent = hits >= 2 ? b.e + b.e : b.e;
    wrap.appendChild(c);
    setTimeout(() => c.remove(), 2200);
  } catch (e) {}
};

// ---------- choosing ----------
let emoSheet = false;
function myEmo(){
  if (screen === 'lobby' && ON.L) { const me = ON.L.seats.findIndex(x => x.pid === ON.pid); if (me >= 0 && ON.L.seats[me].emo) return ON.L.seats[me].emo; }
  if (screen === 'setup' && setup) { const me = setup.seats.findIndex(x => x.human); if (me >= 0 && setup.seats[me].emo) return setup.seats[me].emo; }
  return profile.emo || 'boom';
}
function chooseEmo(id){
  if (!BINK(id)) return;
  profile.emo = id; LS.set('st.profile', profile);
  if (screen === 'setup' && setup) { const me = setup.seats.findIndex(x => x.human); if (me >= 0) setup.seats[me].emo = id; }
  if (screen === 'lobby' && ON.L && !ON.L.started) {
    const me = ON.L.seats.findIndex(x => x.pid === ON.pid);
    if (me >= 0) { if (ON.host) { ON.L.seats[me].emo = id; pushLobby(); } else sendLobbyIntent('emo', {emo:id}); }
  }
}
function emoSheetHTML(){
  const cur = BINK(myEmo()) || BINKS[0];
  return `<div class="mpicker" data-a="emox"><div class="mbox" data-a="noop">
    <h3 class="lh3" style="margin-top:0">BINK EMOJI</h3>
    <div class="emoprev"><span class="pe">${cur.e}</span><div class="pb"><b>You binked Mike!</b><span>“${esc(cur.line)}”</span></div></div>
    <p class="hint center">Pops up over the board every time you bink someone. Double binks get double.</p>
    <div class="mgrid emogrid">${BINKS.map(b => `<button class="mtile ${b.id === cur.id ? 'on' : ''}" data-a="emopick" data-v="${b.id}"><i class="eg">${b.e}</i><b>${esc(b.name)}</b></button>`).join('')}</div>
    <button class="lux-btn" data-a="emox"><span>DONE</span></button></div></div>`;
}
function drawEmoSheet(){
  let el = document.getElementById('epick');
  if (!emoSheet) { if (el) el.remove(); return; }
  const y = el && el.querySelector('.mbox') ? el.querySelector('.mbox').scrollTop : 0;
  if (!el) { el = document.createElement('div'); el.id = 'epick'; document.body.appendChild(el); }
  el.innerHTML = emoSheetHTML();
  const box = el.querySelector('.mbox'); if (box) box.scrollTop = y;
}
window.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a;
  if (a === 'emoopen') { e.stopPropagation(); emoSheet = true; drawEmoSheet(); }
  else if (a === 'emox') { e.stopPropagation(); emoSheet = false; drawEmoSheet(); render(); }
  else if (a === 'emopick') { e.stopPropagation(); chooseEmo(t.dataset.v); drawEmoSheet(); }
  else if (a === 'noop' && t.closest('#epick')) e.stopPropagation();
}, true);

// host: someone in the lobby picked one
const _applyE = applyIntent;
applyIntent = async function(it){
  const L = ON.L;
  if (it.kind === 'emo' && L && !L.started) {
    const me = L.seats.findIndex(x => x.pid === it.pid);
    if (me >= 0 && BINK(it.data && it.data.emo)) { L.seats[me].emo = it.data.emo; await pushLobby(); }
    return;
  }
  return _applyE(it);
};

// a "Bink Emoji" tile under Your Look (new game, lobby, profile), and bring yours into the lobby
const _renderE = render;
render = function(){
  if (screen === 'lobby' && ON.L && !ON.L.started) {
    const me = ON.L.seats.findIndex(x => x.pid === ON.pid);
    if (me >= 0 && !ON.L.seats[me].emo && profile.emo && ON._emoSent !== ON.L.code + me) {
      ON._emoSent = ON.L.code + me;
      if (ON.host) { ON.L.seats[me].emo = profile.emo; pushLobby(); } else sendLobbyIntent('emo', {emo:profile.emo});
    }
  }
  _renderE();
  if (emoSheet && !['setup', 'lobby', 'profile'].includes(screen)) { emoSheet = false; drawEmoSheet(); }
  const row = app.querySelector('.lookrow');
  if (row && !row.querySelector('[data-a="emoopen"]') && ['setup', 'lobby', 'profile'].includes(screen)) {
    const b = BINK(myEmo()) || BINKS[0];
    row.insertAdjacentHTML('beforeend', `<button class="lkemo" data-a="emoopen"><i class="eg">${b.e}</i><span><small>BINK EMOJI</small><b>${esc(b.name)}</b></span></button>`);
  }
};
render();
